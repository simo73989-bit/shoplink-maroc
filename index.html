async function sl90RequestPasswordRecovery(email){
  const r=await fetch(SUPABASE_URL+'/functions/v1/password-recovery',{
    method:'POST',
    headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,redirect_to:AUTH_REDIRECT+'?password_recovery=1'})
  });
  if(!r.ok)throw new Error('Impossible d’envoyer le lien pour le moment.');
  return r.json().catch(()=>({ok:true}));
}

async function sendResetPassword(){

    await sl90RequestPasswordRecovery(email);

  }catch(e){toast(friendlyError(e));}
  finally{setBusy('#resetBtn',false,'Envoyer le lien');}
}

function resetPassword(){

async function updatePassword(){
  const a=$('#newPassword')?.value||'',b=$('#newPassword2')?.value||'';
  if(a.length<8)return toast('8 caractères minimum.'); if(a!==b)return toast('Les mots de passe ne correspondent pas.');
  const token=state.session?.access_token; if(!token)return toast('Lien expiré. Demandez un nouveau lien.');
  setBusy('#passwordBtn',true,'Enregistrement...');
  try{
    const r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:a})});
    const d=await r.json().catch(()=>({})); if(!r.ok)throw new Error(d.msg||d.message||'Impossible de modifier le mot de passe.');
    toast('Mot de passe modifié ✅'); setTimeout(()=>go('dashboard'),700);
  }catch(e){toast(friendlyError(e));}
  finally{setBusy('#passwordBtn',false,'Enregistrer');}
}

async function submitAuth(mode){
  const email=$('#email').value.trim(), pass=$('#password').value;
  const name=mode==='signup'?($('#name').value.trim()||'Vendeur'):'Vendeur';
  if(!email || pass.length<8) return toast('Mot de passe: 8 caractères minimum.');
  if(REMOTE&&!BACKEND_READY) return toast('Service en maintenance. Réessayez dans quelques instants.');
  setBusy('#authBtn', true, mode==='signup'?'Création...':'Connexion...');
  try{
    if(REMOTE){
      if(mode==='signup'){
        const data = await authRequest('/auth/v1/signup?redirect_to='+encodeURIComponent(AUTH_REDIRECT), {email,password:pass,data:{full_name:name}});
        if(!data.access_token){
          history.replaceState(null,'',location.pathname+'#verify-email');
          emailPending(email);
          return;
        }
        state.user={id:data.user.id,name,email}; saveRemoteSession(data);
      } else {
        const data = await authRequest('/auth/v1/token?grant_type=password', {email,password:pass});
        state.user={id:data.user.id,name:data.user.user_metadata?.full_name||'Vendeur',email}; saveRemoteSession(data);
      }
      await loadSellerData(true);
    } else {
      const user={id:'local-user',name,email}; state.user=user; DB.set('sl_user',user);
      if(mode==='signup' && !DB.get('sl_shop_init',false)){
        state.shop={...defaults.shop,slug:slugify(name+' boutique')}; DB.set('sl_shop',state.shop); DB.set('sl_shop_init',true);
      }
    }
    go('dashboard');
  }catch(e){toast(friendlyError(e));}
  finally{setBusy('#authBtn', false, mode==='signup'?"S'inscrire":'Se connecter');}
}

function setBusy(sel,on,text){const el=$(sel); if(!el)return; el.disabled=on; el.textContent=text;}
function friendlyError(e){const m=String(e?.message||e||'Erreur'); if(/Invalid login/i.test(m))return 'Email ou mot de passe incorrect.'; if(/already registered|User already registered/i.test(m))return 'Cet e-mail est déjà utilisé.'; if(/Email not confirmed/i.test(m))return 'Confirmez votre e-mail avant de vous connecter.'; if(/rate limit|too many requests/i.test(m))return 'Trop de tentatives. Réessayez un peu plus tard.'; if(/duplicate key.*slug/i.test(m))return 'Ce lien de boutique est déjà pris.'; if(/stock/i.test(m))return 'Un produit n’est plus disponible en quantité suffisante.'; return m.length>160?'Une erreur est survenue. Réessayez.':m;}

async function authRequest(path, body){
  const r=await fetch(SUPABASE_URL+path,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await r.json().catch(()=>({})); if(!r.ok)throw new Error(data.msg||data.message||data.error_description||'Erreur de connexion'); return data;
}
function saveRemoteSession(data){state.session={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+Number(data.expires_in||3600)*1000}; DB.set('sl_session',state.session); DB.set('sl_user',state.user);}
async function validToken(){
  if(!REMOTE||!state.session)return null;
  if(state.session.expires_at && state.session.expires_at-Date.now()>60000)return state.session.access_token;
  if(!state.session.refresh_token)return null;
  try{const d=await authRequest('/auth/v1/token?grant_type=refresh_token',{refresh_token:state.session.refresh_token}); if(d.user)state.user={id:d.user.id,name:d.user.user_metadata?.full_name||'Vendeur',email:d.user.email}; saveRemoteSession(d); return d.access_token;}catch{return null;}
}

async function api(path,{method='GET',body,auth=false,headers={}}={}){
  const h={apikey:SUPABASE_KEY,'Content-Type':'application/json',...headers};
  if(auth){const token=await validToken(); if(!token)throw new Error('Session expirée. Reconnectez-vous.'); h.Authorization='Bearer '+token;}
  const r=await fetch(SUPABASE_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  const text=await r.text(); let data=null; try{data=text?JSON.parse(text):null}catch{data=text}
  if(!r.ok)throw new Error(data?.message||data?.hint||data?.error||`Erreur ${r.status}`); return data;
}

async function loadSellerData(createIfMissing=false){
  if(!REMOTE)return;
  if(!state.user?.id)throw new Error('Session invalide');
  let shops=await api(`/rest/v1/shops?owner_id=eq.${encodeURIComponent(state.user.id)}&select=*`,{auth:true});
  if(!shops.length && createIfMissing){
    const base=slugify((state.user.name||'ma')+'-boutique');
    let created=null;
    for(let i=0;i<4&&!created;i++){
      const slug=i?`${base}-${Math.floor(1000+Math.random()*9000)}`:base;
      try{created=await api('/rest/v1/shops?select=*',{method:'POST',auth:true,headers:{Prefer:'return=representation'},body:{owner_id:state.user.id,name:'Ma Boutique',slug,description:'Bienvenue dans ma boutique ShopLink Maroc',emoji:'🛍️',category:'Autre',city:'',phone:'',is_open:true}})}catch(e){if(!/duplicate/i.test(String(e.message)))throw e;}
    }
    shops=created||[];
  }
  if(shops[0])state.shop=normalizeShop(shops[0]);
  if(state.shop?.id){
    state.products=(await api(`/rest/v1/products?shop_id=eq.${state.shop.id}&select=*&order=created_at.desc`,{auth:true})).map(normalizeProduct);
    state.orders=(await api('/rest/v1/rpc/get_seller_orders',{method:'POST',auth:true,body:{}})).map(normalizeOrder);
  } else {state.products=[];state.orders=[];}
}

function productsTable(){
  if(!state.products.length)return `<div class="empty">Aucun produit pour le moment.<br><br><button class="btn primary" onclick="openProductModal()">Ajouter votre premier produit</button></div>`;
  return `<div class="tableWrap"><table class="table"><thead><tr><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>Statut</th><th></th></tr></thead><tbody>${state.products.map(p=>`<tr><td><div class="tableProduct">${p.image_url?`<img src="${attr(p.image_url)}" alt="">`:`<span>${esc(p.emoji||'📦')}</span>`}<div><b>${esc(p.name)}</b><small>${esc(p.description||'')}</small></div></div></td><td>${esc(p.category||'Autre')}</td><td>${money(p.price)}</td><td>${p.stock===null||p.stock===''?'—':Number(p.stock)}</td><td><span class="pill ${p.is_active?'':'off'}">${p.is_active?'Actif':'Masqué'}</span></td><td><div class="rowBtns"><button class="iconBtn" title="Modifier" onclick="openProductModal('${p.id}')">✏️</button><button class="iconBtn danger" title="Supprimer" onclick="deleteProduct('${p.id}')">🗑️</button></div></td></tr>`).join('')}</tbody></table></div>`;
}


function ordersTable(limit){
  const arr=limit?state.orders.slice(0,limit):state.orders;
  if(!arr.length)return `<div class="empty">Aucune commande pour le moment.</div>`;
  return `<div class="tableWrap"><table class="table"><thead><tr><th>Client</th><th>Total</th><th>Articles</th><th>Date</th><th>Statut</th></tr></thead><tbody>${arr.map(o=>`<tr><td><b>${esc(o.customer_name||o.name)}</b><br><span class="sub">${esc(o.phone)}</span>${o.address?`<br><span class="sub">${esc(o.address)}</span>`:''}</td><td>${money(o.total)}</td><td>${Array.isArray(o.items)?o.items.reduce((s,x)=>s+Number(x.qty||1),0):0}</td><td>${formatDate(o.created_at||o.createdAt)}</td><td><select class="statusSelect" onchange="updateOrderStatus('${o.id}',this.value)">${Object.entries(statusLabels).map(([v,l])=>`<option value="${v}" ${o.status===v?'selected':''}>${l}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`;
}

  const p=state.products.find(x=>String(x.id)===String(id))||{name:'',price:'',description:'',category:'Autre',stock:'',emoji:'📦',image_url:'',is_active:true};

function previewImage(input){const f=input.files?.[0]; if(!f)return; if(f.size>50*1024*1024){input.value='';return toast('Photo trop lourde: 50 MB maximum.');}const url=URL.createObjectURL(f);$('#imagePreview').innerHTML=`<img src="${url}" alt="Aperçu">`;}

async function saveProduct(id=''){
  const name=$('#pName').value.trim(),price=Number($('#pPrice').value),desc=$('#pDesc').value.trim(),emoji=$('#pEmoji').value||'📦',category=$('#pCategory').value,stockRaw=$('#pStock').value,is_active=$('#pActive').checked;
  if(!name||Number.isNaN(price)||price<0)return toast('Ajoutez un nom et un prix valide.');
  const existing=state.products.find(x=>String(x.id)===String(id));
  let image_url=existing?.image_url||'';
  const file=$('#pImage')?.files?.[0];
  setBusy('#productSaveBtn',true,'Enregistrement...');
  try{
    if(file){image_url=REMOTE?await uploadImage(file):await imageToDataUrl(file);}
    const payload={name,price,description:desc,emoji,category,stock:stockRaw===''?null:Number(stockRaw),image_url:image_url||null,is_active};
    if(REMOTE){
      if(id){const rows=await api(`/rest/v1/products?id=eq.${encodeURIComponent(id)}&select=*`,{method:'PATCH',auth:true,headers:{Prefer:'return=representation'},body:payload}); const i=state.products.findIndex(x=>x.id===id); if(i>=0)state.products[i]=normalizeProduct(rows[0]);}
      else {const rows=await api('/rest/v1/products?select=*',{method:'POST',auth:true,headers:{Prefer:'return=representation'},body:{...payload,shop_id:state.shop.id}}); state.products.unshift(normalizeProduct(rows[0]));}
    }else{
      if(id){const i=state.products.findIndex(x=>String(x.id)===String(id)); state.products[i]={...state.products[i],...payload};}
      else state.products.unshift({id:crypto.randomUUID(),shop_id:'local-shop',created_at:new Date().toISOString(),...payload});
      DB.set('sl_products',state.products);
    }
    $('#modal')?.remove();dashTab('products');toast(id?'Produit modifié ✅':'Produit ajouté ✅');
  }catch(e){toast(friendlyError(e));}
  finally{setBusy('#productSaveBtn',false,id?'Enregistrer':'Ajouter');}
}

async function deleteProduct(id){
  if(!confirm('Supprimer ce produit ?'))return;
  try{if(REMOTE)await api(`/rest/v1/products?id=eq.${encodeURIComponent(id)}`,{method:'DELETE',auth:true});state.products=state.products.filter(x=>String(x.id)!==String(id));if(!REMOTE)DB.set('sl_products',state.products);dashTab('products');toast('Produit supprimé.');}catch(e){toast(friendlyError(e));}
}

async function saveShop(){
  const payload={name:$('#shopName').value.trim()||'Ma Boutique',slug:slugify($('#shopSlug').value),description:$('#shopDesc').value.trim(),emoji:$('#shopEmoji').value||'🛍️',category:$('#shopCategory').value,city:$('#shopCity').value.trim(),phone:$('#shopPhone').value.trim(),is_open:$('#shopOpen').checked};
  if(payload.slug.length<3)return toast('Le lien doit contenir au moins 3 caractères.');
  setBusy('#saveShopBtn',true,'Enregistrement...');
  try{
    if(REMOTE){const rows=await api(`/rest/v1/shops?id=eq.${state.shop.id}&select=*`,{method:'PATCH',auth:true,headers:{Prefer:'return=representation'},body:payload});state.shop=normalizeShop(rows[0]);}
    else{state.shop={...state.shop,...payload};DB.set('sl_shop',state.shop);}

async function consumeAuthCallback(){
  if(!REMOTE)return false;

  const search=new URLSearchParams(location.search);
  const raw=location.hash.startsWith('#')?location.hash.slice(1):'';
  const hp=new URLSearchParams(raw);
  const forceRecovery=search.get('support_recovery')==='1'||search.get('password_recovery')==='1';

  let access_token=hp.get('access_token')||'';
  let refresh_token=hp.get('refresh_token')||'';
  let expires_in=Number(hp.get('expires_in')||3600);
  let type=hp.get('type')||search.get('type')||'';

  try{
    if(!access_token){
      const token_hash=search.get('token_hash')||hp.get('token_hash')||'';
      if(token_hash&&type){
        const vr=await fetch(`${SUPABASE_URL}/auth/v1/verify`,{
          method:'POST',
          headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},
          body:JSON.stringify({token_hash,type})
        });
        const vd=await vr.json().catch(()=>({}));
        if(!vr.ok)throw new Error(vd.msg||vd.message||vd.error_description||'Lien expiré ou invalide.');
        access_token=vd.access_token||vd.session?.access_token||'';
        refresh_token=vd.refresh_token||vd.session?.refresh_token||'';
        expires_in=Number(vd.expires_in||vd.session?.expires_in||3600);
      }
    }

    if(!access_token){
      if(forceRecovery){
        history.replaceState(null,'',location.pathname+'#forgot-password');
        forgotPassword();
        toast('Lien de récupération invalide ou expiré. Demandez un nouveau lien.');
        return true;
      }
      return false;
    }

    state.session={access_token,refresh_token,expires_at:Date.now()+expires_in*1000};
    DB.set('sl_session',state.session);

    const r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+access_token}});
    if(!r.ok)throw new Error('Lien invalide');
    const u=await r.json();

    state.user={id:u.id,name:u.user_metadata?.full_name||'Vendeur',email:u.email};
    DB.set('sl_user',state.user);

    if(type==='recovery'||forceRecovery){
      try{
        const banned=await api('/rest/v1/rpc/is_current_user_permanently_banned',{method:'POST',auth:true,body:{}});
        if(banned===true){
          state.session=null;state.user=null;DB.set('sl_session',null);DB.set('sl_user',null);
          history.replaceState(null,'',location.pathname+'#login');
          toast('Ce compte est banni définitivement.');
          return true;
        }
      }catch{}
      history.replaceState(null,'',location.pathname+'#reset-password');
      resetPassword();
      return true;
    }

    history.replaceState(null,'',location.pathname+'#confirmed');
    confirmationSuccess();
    return true;
  }catch(e){
    state.session=null;state.user=null;DB.set('sl_session',null);DB.set('sl_user',null);
    if(forceRecovery||type==='recovery'){
      history.replaceState(null,'',location.pathname+'#forgot-password');
      forgotPassword();
      toast('Lien de récupération invalide ou expiré. Demandez un nouveau lien.');
      return true;
    }
    history.replaceState(null,'',location.pathname+'#login');
    toast('Confirmation terminée. Connectez-vous à votre compte.');
    return false;
  }
}

function slxOrderStats(){
  const active=state.orders.filter(o=>o.status!=='cancelled');
  const now=new Date(), ms=new Date(now.getFullYear(),now.getMonth(),1);
  const month=active.filter(o=>{const d=new Date(o.created_at||o.createdAt||0);return d>=ms});
  const avg=active.length?active.reduce((s,o)=>s+Number(o.total||0),0)/active.length:0;
  const fresh=state.orders.filter(o=>o.status==='new').length;
  const low=state.products.filter(p=>p.is_active!==false&&p.stock!==null&&p.stock!==undefined&&Number(p.stock)<=3).length;
  return {monthSales:month.reduce((s,o)=>s+Number(o.total||0),0),monthOrders:month.length,avg,fresh,low};
}

  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=Number(pos.coords.latitude).toFixed(6),lng=Number(pos.coords.longitude).toFixed(6);
    input.value=`Localisation GPS: https://www.google.com/maps?q=${lat},${lng}`;

<script id="slsec-script">
(function(){
  const PRODUCT_LIMIT=30;
  function digits(v=''){return String(v).replace(/\D/g,'')}
  function phoneOk(v=''){let d=digits(v);if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('212'))return /^212[67]\d{8}$/.test(d);return /^0[67]\d{8}$/.test(d)}
  function shopReady(s){if(!s||s.id==='demo')return true;const n=String(s.name||'').trim(),c=String(s.city||'').trim(),p=String(s.phone||'').trim();return n.length>=3&&!/^ma boutique$/i.test(n)&&c.length>=2&&phoneOk(p)}
  window.slsecShopReady=shopReady;

  const baseSaveShop=window.saveShop;
  if(baseSaveShop) window.saveShop=async function(){
    const ph=document.querySelector('#shopPhone')?.value.trim()||'';
    if(ph&&!phoneOk(ph)) return toast('Numéro WhatsApp invalide.');

  const baseAuth=window.auth;

  const baseSubmit=window.submitAuth;

  function trustHtml(s){return `<div class="slsec-trust"><span class="slsec-chip">✓ E-mail confirmé</span>${phoneOk(s.phone)?'<span class="slsec-chip">📞 WhatsApp renseigné</span>':''}${s.city?`<span class="slsec-chip">📍 ${esc(s.city)}</span>`:''}</div>`}
  function safetyHtml(){return `<div class="slsec-warn"><b>🛡️ Conseil sécurité :</b> vérifiez le vendeur et le produit avant tout paiement. Évitez d’envoyer une avance si vous n’êtes pas sûr de la personne ou de l’offre. ShopLink Maroc facilite la mise en relation mais ne garantit pas chaque vendeur.</div>`}

    const head=document.querySelector('.shopHeadInner>div:last-child');

  };
  window.slsecSendReport=async function(productId=''){

      toast(signed?'Signalement envoyé. La réponse apparaîtra dans Mon compte ✅':'Signalement envoyé. Connectez-vous la prochaine fois pour recevoir une réponse ✅');
    }catch(e){
      try{const q=JSON.parse(localStorage.getItem('sl_pending_reports')||'[]');q.push({...payload,created_at:new Date().toISOString()});localStorage.setItem('sl_pending_reports',JSON.stringify(q.slice(-20)))}catch{}
      if(btn){btn.disabled=false;btn.textContent='Réessayer'}

  let sl54OtpState=null;
  let sl54ResendTimer=null;
  function sl54CooldownKey(phone=''){
    return 'sl54_otp_resend_at_'+String(phone||'').replace(/\D/g,'');
  }
  function sl54GetResendAt(phone=''){
    try{
      const v=Number(sessionStorage.getItem(sl54CooldownKey(phone))||0);
      return Number.isFinite(v)?v:0;
    }catch{return 0}
  }
  function sl54SetResendAt(phone='',ms=60000){
    const at=Date.now()+ms;
    if(sl54OtpState)sl54OtpState.resendAt=at;
    try{
      sessionStorage.setItem(sl54CooldownKey(phone),String(at));
      if(sl54OtpState)sessionStorage.setItem('sl54_pending_order',JSON.stringify(sl54OtpState));
    }catch{}
    return at;
  }
  function sl54RenderResendCooldown(btn){
    if(!btn||!sl54OtpState)return;
    if(sl54ResendTimer){clearInterval(sl54ResendTimer);sl54ResendTimer=null}
    const tick=function(){
      const s=sl54OtpState;
      if(!s){if(sl54ResendTimer)clearInterval(sl54ResendTimer);sl54ResendTimer=null;return}
      const at=Math.max(Number(s.resendAt||0),sl54GetResendAt(s.phone));
      s.resendAt=at;
      const left=Math.max(0,Math.ceil((at-Date.now())/1000));
      if(left>0){
        btn.disabled=true;
        btn.textContent='Renvoyer le code ('+left+'s)';
      }else{
        btn.disabled=false;
        btn.textContent='Renvoyer le code';
        if(sl54ResendTimer)clearInterval(sl54ResendTimer);
        sl54ResendTimer=null;
      }
    };
    tick();
    if(Number(sl54OtpState.resendAt||0)>Date.now())sl54ResendTimer=setInterval(tick,1000);
  }
  function sl54PhoneE164(v=''){
    let d=String(v||'').replace(/\D/g,'');
    if(d.startsWith('00'))d=d.slice(2);
    if(d.startsWith('0'))d='212'+d.slice(1);
    if(!d.startsWith('212'))return '';
    return '+'+d;
  }
  function sl54MaskPhone(v=''){
    const d=String(v||'').replace(/\D/g,'');
    if(d.length<6)return '••••••••';
    return d.slice(0,3)+' •• •• •• '+d.slice(-2);
  }

  window.sl54SendOtp=async function(){
    const s=sl54OtpState;if(!s)return;
    const cooldownAt=Math.max(Number(s.resendAt||0),sl54GetResendAt(s.phone));
    s.resendAt=cooldownAt;
    if(cooldownAt>Date.now()){
      sl54OtpModal(s.testOnly===true?'Mode test activé. Entrez votre code test privé.':'Attendez la fin du délai avant de renvoyer le code.');
      return;
    }
    if(s.testMode===true){
      s.testOnly=true;
      sl54SetResendAt(s.phone,60000);
      sl54OtpModal('Mode test activé. Entrez votre code test privé.');
      return;
    }
    const e164=sl54PhoneE164(s.phone);if(!e164)return toast('Numéro invalide.');
    try{
      const r=await fetch(SUPABASE_URL+'/auth/v1/otp',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({phone:e164})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.msg||d.message||d.error_description||'Service SMS indisponible');
      s.testOnly=false;
      sl54SetResendAt(s.phone,60000);
      sl54OtpModal('Code envoyé. Vous pourrez le renvoyer dans 60 secondes.');
    }catch(e){
      s.testOnly=true;
      sl54SetResendAt(s.phone,60000);
      sl54OtpModal('Le service SMS OTP n’est pas encore configuré. Pour vos essais, utilisez votre code test privé.');
    }
  };
  window.sl54VerifyOtp=async function(){
    const s=sl54OtpState;if(!s)return;
    const token=(document.querySelector('#sl54OtpCode')?.value||'').replace(/\D/g,'');
    if(token.length!==6)return toast('Entrez le code OTP à 6 chiffres.');
    setBusy('#sl54VerifyBtn',true,'Vérification…');
    let access='';
    try{
      let testVerified=false;
      try{
        await api('/rest/v1/rpc/verify_order_phone_test_guest',{method:'POST',auth:false,body:{p_order_id:s.orderId,p_phone:s.phone,p_code:token}});
        testVerified=true;
      }catch(te){
        if(!/invalid_test_code/i.test(String(te?.message||te||'')))throw te;
        if(s.testOnly===true)throw te;
      }
      if(!testVerified){
        const e164=sl54PhoneE164(s.phone);
        const vr=await fetch(SUPABASE_URL+'/auth/v1/verify',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({type:'sms',phone:e164,token})});
        const vd=await vr.json().catch(()=>({}));
        if(!vr.ok||!vd.access_token)throw new Error(vd.msg||vd.message||'Code incorrect ou expiré');
        access=vd.access_token;
        const rr=await fetch(SUPABASE_URL+'/rest/v1/rpc/verify_order_phone',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({p_order_id:s.orderId})});
        const rd=await rr.json().catch(()=>({}));
        if(!rr.ok)throw new Error(rd.message||rd.error||'Vérification impossible');
        try{await fetch(SUPABASE_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+access}})}catch{}
      }
      try{
        sessionStorage.removeItem('sl54_pending_order');
        sessionStorage.removeItem(sl54CooldownKey(s.phone));
      }catch{}
      if(sl54ResendTimer){clearInterval(sl54ResendTimer);sl54ResendTimer=null}
      document.querySelectorAll('#modal').forEach(function(x){x.remove()});
      const successModal=document.createElement('div');
      successModal.className='modal';
      successModal.id='modal';
      successModal.dataset.otpSuccess='1';
      const successBox=document.createElement('div');
      successBox.className='modalBox successBox';
      const successIcon=document.createElement('div');successIcon.className='successIcon';successIcon.textContent='✓';
      const successTitle=document.createElement('h2');successTitle.textContent='Commande vérifiée !';
      const successText=document.createElement('p');
      successText.append(document.createTextNode('Merci '+String(s.name||'')+'. La commande '));
      const successRef=document.createElement('b');successRef.textContent='#'+String(s.ref||'');
      successText.append(successRef,document.createTextNode(' est maintenant confirmée par OTP.'));
      const successSub=document.createElement('p');successSub.className='sub';successSub.textContent='Le vendeur peut maintenant choisir de débloquer vos coordonnées pour 5 DH.';
      const successBtn=document.createElement('button');successBtn.className='btn primary full';successBtn.textContent='Continuer';successBtn.onclick=function(){successModal.remove()};
      successBox.append(successIcon,successTitle,successText,successSub,successBtn);
      successModal.appendChild(successBox);
      document.body.appendChild(successModal);
      sl54OtpState=null;
    }catch(e){toast(friendlyError(e));setBusy('#sl54VerifyBtn',false,'Vérifier la commande')}
  };

  function sl41AdminTable(rows){if(!rows.length)return '<div class="empty">Aucune boutique.</div>';return `<div class="tableWrap"><table class="table"><thead><tr><th>Boutique</th><th>Vendeur</th><th>Activité</th><th>Déblocages</th><th>État</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span class="sub">${esc(x.city||'—')} · ${esc(x.category||'Autre')}</span><br><span class="sub">/store/${esc(x.slug)}</span></td><td>${esc(x.seller_name||'Vendeur')}<br><span class="sub">${esc(x.seller_email||'')}</span></td><td>${Number(x.products_count||0)} produits · ${Number(x.orders_count||0)} commandes<br><b>${money(x.sales_total||0)}</b>${Number(x.reports_count||0)?` · ⚑ ${Number(x.reports_count)}`:''}</td><td>${Number(x.contacts_unlocked_count||0)} débloqués<br><span class="sub">5 DH / contact</span></td><td><span class="sl41-adminBadge ${x.is_open?'':'off'}">${x.is_open?'Ouverte':'Fermée'}</span></td><td><div class="sl41-order-actions"><button class="btn soft sl41-mini" onclick="window.open('${shopUrl(x.slug)}','_blank')">Voir</button><button class="btn ${x.is_open?'soft':'primary'} sl41-mini" onclick="sl41AdminSetOpen('${x.id}',${x.is_open?'false':'true'})">${x.is_open?'Fermer':'Ouvrir'}</button></div></td></tr>`).join('')}</tbody></table></div>`}
  window.sl41FilterAdmin=function(){const q=(document.querySelector('#sl41AdminQ')?.value||'').toLowerCase(),city=document.querySelector('#sl41AdminCity')?.value||'',st=document.querySelector('#sl41AdminOpen')?.value||'';const rows=(sl41.admin?.shops||[]).filter(x=>(!q||`${x.name||''} ${x.seller_name||''} ${x.seller_email||''} ${x.city||''} ${x.category||''}`.toLowerCase().includes(q))&&(!city||x.city===city)&&(!st||(st==='open'?x.is_open:!x.is_open)));const box=document.querySelector('#sl41AdminShops');if(box)box.innerHTML=sl41AdminTable(rows)};
  window.sl41AdminSetOpen=async function(id,isOpen){try{await api('/rest/v1/rpc/admin_set_shop_open',{method:'POST',auth:true,body:{p_shop_id:id,p_is_open:isOpen}});toast(isOpen?'Boutique ouverte ✅':'Boutique fermée ✅');await sl41RenderAdmin()}catch(e){toast(friendlyError(e))}};

  async function sl41Explore(){showLoader('Chargement des boutiques…');try{const rows=REMOTE?await api('/rest/v1/rpc/get_public_shops',{method:'POST',body:{}}):[state.shop];sl41.publicShops=Array.isArray(rows)?rows.map(normalizeShop):[];sl41PaintExplore()}catch(e){app.innerHTML=`<div class="centerError">${brand()}<h2>Impossible de charger les boutiques</h2><p>${esc(friendlyError(e))}</p><button class="btn primary" onclick="go('home')">Accueil</button></div>`}}
  window.sl41Explore=sl41Explore;
  const sl41MoroccoCities=["Casablanca","Rabat","Salé","Témara","Kénitra","Mohammedia","Marrakech","Fès","Meknès","Tanger","Tétouan","Agadir","Inezgane","Oujda","Nador","Berkane","El Jadida","Safi","Settat","Berrechid","Khouribga","Béni Mellal","Taza","Larache","Khémisset","Al Hoceima","Essaouira","Ouarzazate","Guelmim","Laâyoune","Dakhla"];window.sl41MoroccoCities=sl41MoroccoCities;
  function sl41Norm(v=''){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase()}
  function sl41PaintExplore(){const rows=sl41.publicShops||[];const cities=[...new Set([...sl41MoroccoCities,...rows.map(x=>x.city).filter(Boolean)])].sort((a,b)=>String(a).localeCompare(String(b),'fr'));const cats=[...new Set([...(Array.isArray(categories)?categories:[]),...rows.map(x=>x.category).filter(Boolean)])];app.innerHTML=`<div class="sl41-explore"><div class="storeNav"><div class="container">${brand()}<div class="storeNavActions"><button class="btn soft" onclick="go('home')">Accueil</button><button class="btn primary" onclick="location.href='/create-store'">Créer ma boutique</button></div></div></div><section class="sl41-exploreHero"><div class="container"><span class="badge">🇲🇦 Boutiques ShopLink Maroc</span><h1 style="font-size:clamp(34px,6vw,58px);margin:14px 0 8px">Découvrez des boutiques près de vous.</h1><p style="color:#b8c1bd">Recherchez par nom, ville ou catégorie et voyez celles qui sont ouvertes.</p></div></section><main class="container"><div class="sl41-publicTools" style="margin-top:24px"><input id="sl41ExploreQ" placeholder="Rechercher une boutique…" oninput="sl41FilterExplore()"><input id="sl41ExploreCity" list="sl41ExploreCityList" autocomplete="off" placeholder="Toutes les villes — écrire ou choisir" oninput="sl41FilterExplore()"><datalist id="sl41ExploreCityList">${cities.map(x=>`<option value="${attr(x)}"></option>`).join('')}</datalist><input id="sl41ExploreCat" list="sl41ExploreCatList" autocomplete="off" placeholder="Toutes les catégories — écrire ou choisir" oninput="sl41FilterExplore()"><datalist id="sl41ExploreCatList">${cats.map(x=>`<option value="${attr(x)}"></option>`).join('')}</datalist></div><label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="sl41ExploreOpen" onchange="sl41FilterExplore()"> Ouvert maintenant</label><div class="sl41-exploreGrid" id="sl41ExploreGrid">${sl41ExploreCards(rows)}</div></main></div>`}
  function sl41ExploreCards(rows){if(!rows.length)return '<div class="sl41-empty">Aucune boutique trouvée.</div>';return rows.map(s=>`<article class="sl41-shopCard" style="border-top:4px solid ${validHex(s.primary_color)?s.primary_color:themeDefaults.primary_color}"><div class="sl41-shopIcon">${s.logo_url?`<img src="${attr(s.logo_url)}" alt="">`:esc(s.emoji||'🛍️')}</div><div><span class="sl41-adminBadge ${s.is_open?'':'off'}">${s.is_open?'Ouvert':'Fermé'}</span><h3 style="margin:8px 0 4px">${esc(s.name)}</h3><div class="sl41-shopMeta">${s.city?`<span>📍 ${esc(s.city)}</span>`:''}${s.category?`<span>${esc(s.category)}</span>`:''}</div></div><p class="sub" style="margin:0">${esc((s.description||'').slice(0,140))}</p><button class="btn primary full" onclick="location.href='${shopUrl(s.slug)}'">Voir la boutique</button></article>`).join('')}
  window.sl41FilterExplore=function(){const q=sl41Norm(document.querySelector('#sl41ExploreQ')?.value||''),city=sl41Norm(document.querySelector('#sl41ExploreCity')?.value||''),cat=sl41Norm(document.querySelector('#sl41ExploreCat')?.value||''),open=!!document.querySelector('#sl41ExploreOpen')?.checked;const rows=(sl41.publicShops||[]).filter(s=>(!q||sl41Norm(`${s.name||''} ${s.description||''} ${s.city||''} ${s.category||''}`).includes(q))&&(!city||sl41Norm(s.city).includes(city))&&(!cat||sl41Norm(s.category).includes(cat))&&(!open||s.is_open));const g=document.querySelector('#sl41ExploreGrid');if(g)g.innerHTML=sl41ExploreCards(rows)};


  // v44: all global navigation leaves deep /store/* and /create-store routes correctly.
  window.go=function(route='home'){
    const r=String(route||'home');
    const target=r==='home'?'/' : '/#'+encodeURIComponent(r);
    history.pushState(null,'',target);
    return window.render();
  };

  const SL41_landing=window.landing;
  window.landing=function(){SL41_landing();const actions=document.querySelector('.hero .actions');if(actions&&!actions.querySelector('.sl41-discover'))actions.insertAdjacentHTML('beforeend','<button class="btn ghost sl41-discover" onclick="go(\'explore\')">Découvrir les boutiques</button>');const nav=document.querySelector('.navlinks');if(nav&&!nav.querySelector('.sl41-nav-discover'))nav.insertAdjacentHTML('afterbegin','<a class="sl41-nav-discover" href="#explore" onclick="event.preventDefault();go(\'explore\')">Découvrir</a>')};

  const SL41_auth=window.auth;
  window.auth=function(mode){SL41_auth(mode);if(mode==='signup')setTimeout(sl41InjectTemplate,0)};
  function sl41InjectTemplate(){const card=document.querySelector('.authCard');if(!card||document.querySelector('#sl41Template'))return;const btn=document.querySelector('#authBtn')||card.querySelector('.btn.primary');if(!btn)return;btn.insertAdjacentHTML('beforebegin',`<div class="field" id="sl41Template"><label>Catégorie principale</label><select id="sl41TemplateValue">${categories.map(c=>`<option value="${attr(c)}" ${c==='Autre'?'selected':''}>${esc(c)}</option>`).join('')}</select><small style="display:block;margin-top:6px;color:#738078">Choisissez la catégorie la plus proche de votre activité.</small></div>`)}
  const SL41_submitAuth=window.submitAuth;
  window.submitAuth=async function(mode){if(mode==='signup'){const v=document.querySelector('#sl41TemplateValue')?.value||'Autre';try{localStorage.setItem('sl41_template',JSON.stringify({value:v,at:Date.now()}))}catch{}}return SL41_submitAuth(mode)};

  const SL41_render=window.render;
  window.render=async function(){const path=location.pathname.replace(/\/+$/,'')||'/';if(/^\/store\//i.test(path)){const slug=decodeURIComponent(path.split('/').filter(Boolean).slice(1).join('/'));return publicStore(slug)}if(path==='/create-store'){if(state.user)return dashboard();auth('signup');sl41InjectTemplate();return}const r=location.hash.slice(1);if(r==='explore')return sl41Explore();return SL41_render()};
  window.addEventListener('popstate',()=>window.render());


  window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(r==='features'||r==='how')setTimeout(()=>document.getElementById(r)?.scrollIntoView({behavior:'smooth',block:'start'}),0)});

  // Refresh the first screen after the final overrides are installed.
  setTimeout(async()=>{try{if(REMOTE&&state.user){await loadSellerData(false)}await window.render()}catch(e){console.error('ShopLink v48 boot',e)}},120);
})();
</script>

<style id="sl60-style">
.sl60Bell{position:relative;min-width:42px;padding:9px 11px}
.sl60BellCount{position:absolute;top:-5px;right:-5px;background:#ef4444;color:#fff;border-radius:999px;min-width:19px;height:19px;display:grid;place-items:center;font-size:10px;font-weight:900;border:2px solid #0c1310}
.sl60Notice{padding:12px 0;border-bottom:1px solid #e7ece9;cursor:pointer}
.sl60Notice:last-child{border-bottom:0}.sl60Notice.unread{font-weight:700}
.sl60Notice time{display:block;color:#718078;font-size:11px;margin-top:4px}
.sl60TrackPage{min-height:100vh;background:#f5f7f6;color:#111}
.sl60TrackHero{background:#0b100e;color:#fff;padding:44px 0 34px}
.sl60TrackCard{max-width:720px;margin:26px auto;background:#fff;border:1px solid #e1e7e3;border-radius:20px;padding:22px}
.sl60TrackForm{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}
.sl60Timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:22px}
.sl60Step{background:#edf1ef;border-radius:12px;padding:12px 8px;text-align:center;font-size:12px;color:#6f7b75}
.sl60Step.done{background:#dcfce7;color:#166534;font-weight:800}.sl60Step.current{outline:2px solid #16a34a}
.sl60Items{display:grid;gap:8px;margin-top:14px}.sl60Item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf0ee}
.sl60AnalyticsGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sl60Metric{background:#fff;border:1px solid #e3e8e5;border-radius:14px;padding:15px}.sl60Metric b{display:block;font-size:22px}.sl60Metric span{font-size:11px;color:#718078}
.sl60TopProducts{display:grid;gap:9px}.sl60TopRow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #edf0ee}
.sl60Bars{display:flex;align-items:end;gap:8px;height:130px;padding-top:15px}.sl60BarCol{flex:1;text-align:center;font-size:10px;color:#718078}.sl60Bar{background:#16a34a;border-radius:7px 7px 2px 2px;min-height:4px;margin-bottom:5px}
.sl60AdminTabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.sl60AdminTabs button.active{background:#153622;color:#fff}
.sl60RiskHigh{color:#b42318;font-weight:800}.sl60RiskMid{color:#8a6500;font-weight:800}
.sl60Legal{max-width:850px;margin:28px auto;background:#fff;color:#111;border:1px solid #e3e8e5;border-radius:20px;padding:26px}
.sl60Legal h1{margin-top:0}.sl60Legal h2{margin-top:24px;font-size:20px}.sl60Legal p,.sl60Legal li{line-height:1.7;color:#52615a}
.sl60FooterLinks{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:10px}.sl60FooterLinks button{background:none;border:0;color:#91a09a;padding:4px}
.sl60Blocked{border:1px solid #f1c3c3;background:#fff5f5;color:#7a1b1b;border-radius:16px;padding:22px}
@media(max-width:700px){
 .sl60TrackForm{grid-template-columns:1fr}.sl60Timeline{grid-template-columns:1fr}.sl60AnalyticsGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .sl60TrackCard{margin:14px}.sl60Legal{margin:14px;padding:18px}
}
@media(max-width:420px){.sl60AnalyticsGrid{grid-template-columns:1fr}}
</style>
<script id="sl60-script">
(function(){
  const S={notifications:{unread:0,items:[]},stats:null,adminUsers:null,adminRisk:null,lastUnread:0,poll:null};
  window.SL60=S;

  const FE=window.friendlyError;
  window.friendlyError=function(e){
    const m=String(e&&e.message||e||'');
    if(/tracking_not_found/i.test(m))return 'Commande introuvable. Verifiez le numero de commande et le telephone.';
    if(/client_blocked/i.test(m))return 'Cette commande a ete refusee par la protection anti-abus.';
    if(/account_blocked/i.test(m))return 'Ce compte est bloque par l administration ShopLink.';
    if(/cannot_block_self/i.test(m))return 'Vous ne pouvez pas bloquer votre propre compte admin.';
    return FE(e);
  };

  function sl60Ref(o){return o.order_number||String(o.id||'').replace(/-/g,'').slice(0,8).toUpperCase()}
  function sl60StatusLabel(v){return (window.statusLabels&&statusLabels[v])||({new:'Nouvelle',confirmed:'Confirmee',preparing:'En preparation',ready:'Prete',delivered:'Livree',cancelled:'Annulee'}[v]||v||'Nouvelle')}
  function sl60MapsUrl(a){a=String(a||'').trim();if(!a)return'';const m=a.match(/https?:\/\/[^\s]+/i);return m?m[0]:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a)}

  window.orderDetail=function(id){
    const o=state.orders.find(function(x){return String(x.id)===String(id)});if(!o)return;
    const unlocked=o.contact_unlocked===true;
    const items=(o.items||[]).map(function(x){
      return '<div class="sl60Item"><span><b>'+Number(x.qty||1)+' x</b> '+esc(x.name||'Article')+'</span><b>'+money(Number(x.price||0)*Number(x.qty||1))+'</b></div>';
    }).join('');
    const address=unlocked&&o.address?'<p><b>Adresse:</b> '+esc(o.address)+'</p><button class="btn soft full" onclick="window.open(\''+sl60MapsUrl(o.address)+'\',\'_blank\',\'noopener\')">Ouvrir dans Maps</button>':'<p class="sub">Adresse et localisation masquees avant deblocage.</p>';
    document.querySelector('#modal')?.remove();
    document.body.insertAdjacentHTML('beforeend','<div class="modal" id="modal"><div class="modalBox"><div class="panelHead"><div><h2>Commande #'+esc(sl60Ref(o))+'</h2><div class="sub">'+formatDate(o.created_at)+'</div></div><button class="closeBtn" onclick="document.querySelector(\'#modal\').remove()">x</button></div><div style="margin:12px 0"><span class="sl41-adminBadge '+(o.phone_verified?'':'off')+'">'+(o.phone_verified?'Numero verifie':'En attente OTP')+'</span> <span class="sl41-adminBadge '+(unlocked?'':'off')+'">'+(unlocked?'Coordonnees ouvertes':'Coordonnees protegees')+'</span></div><p><b>Client:</b> '+esc(o.customer_name||'Client')+'<br><b>Telephone:</b> '+esc(o.phone||'')+'<br><b>Ville:</b> '+esc(o.city||'—')+'<br><b>Livraison:</b> '+esc(o.delivery_method||'—')+'<br><b>Statut:</b> '+esc(sl60StatusLabel(o.status))+'</p>'+address+(o.note?'<p><b>Note:</b> '+esc(o.note)+'</p>':'')+'<h3>Articles</h3><div class="sl60Items">'+items+'</div><div class="panelHead" style="margin-top:16px"><b>Total</b><b>'+money(o.total)+'</b></div></div></div>');
  };

  async function sl60LoadNotifications(silent){
    if(!REMOTE||!state.user)return;
    try{
      const d=await api('/rest/v1/rpc/get_seller_notifications',{method:'POST',auth:true,body:{p_limit:20}});
      S.notifications=d||{unread:0,items:[]};
      const n=Number(S.notifications.unread||0);
      document.querySelectorAll('.sl60BellCount').forEach(function(x){x.textContent=n;x.style.display=n?'grid':'none'});
      if(silent&&S.lastUnread&&n>S.lastUnread)toast('Nouvelle commande verifiee');
      S.lastUnread=n;
    }catch(e){}
  }
  window.sl60OpenNotifications=async function(){
    await sl60LoadNotifications(false);
    const rows=(S.notifications.items||[]).map(function(n){
      return '<div class="sl60Notice '+(n.read_at?'':'unread')+'" onclick="sl60OpenNoticeOrder(\''+esc(n.order_id||'')+'\')"><div>'+esc(n.title||'Notification')+'</div><div class="sub">'+esc(n.body||'')+'</div><time>'+formatDate(n.created_at)+'</time></div>';
    }).join('')||'<div class="empty">Aucune notification.</div>';
    document.querySelector('#modal')?.remove();
    document.body.insertAdjacentHTML('beforeend','<div class="modal" id="modal"><div class="modalBox"><div class="panelHead"><h2>Notifications</h2><button class="closeBtn" onclick="document.querySelector(\'#modal\').remove()">x</button></div>'+rows+'</div></div>');
    try{await api('/rest/v1/rpc/mark_seller_notifications_read',{method:'POST',auth:true,body:{}});S.notifications.unread=0;document.querySelectorAll('.sl60BellCount').forEach(function(x){x.style.display='none'})}catch(e){}
  };
  window.sl60OpenNoticeOrder=function(id){
    document.querySelector('#modal')?.remove();
    dashTab('orders');
    setTimeout(function(){orderDetail(id)},120);
  };
  function sl60InstallBell(){
    const d=document.querySelector('.dashUser');if(!d||d.querySelector('.sl60Bell'))return;
    d.insertAdjacentHTML('afterbegin','<button class="btn ghost sl60Bell" onclick="sl60OpenNotifications()" title="Notifications">🔔<span class="sl60BellCount" style="display:none">0</span></button>');
    sl60LoadNotifications(false);
    if(!S.poll)S.poll=setInterval(function(){if(document.querySelector('.dashboard'))sl60LoadNotifications(true)},30000);
  }

  async function sl60CheckAccount(){
    if(!REMOTE||!state.user)return;
    try{
      const x=await api('/rest/v1/rpc/get_account_status',{method:'POST',auth:true,body:{}});
      if(x&&x.blocked){
        const m=document.querySelector('#dashMain');
        if(m)m.innerHTML='<div class="sl60Blocked"><h2>Compte bloque</h2><p>'+esc(x.reason||'Contactez l administration ShopLink Maroc.')+'</p></div>';
      }
    }catch(e){}
  }

  async function sl60LoadStats(){
    const box=document.querySelector('#sl60Analytics');if(!box||!REMOTE)return;
    try{
      const s=await api('/rest/v1/rpc/get_seller_dashboard_stats',{method:'POST',auth:true,body:{}});
      S.stats=s;
      const top=(s.top_products||[]).map(function(x){return '<div class="sl60TopRow"><span>'+esc(x.name||'Produit')+'</span><b>'+Number(x.qty||0)+'</b></div>'}).join('')||'<div class="empty">Pas encore de donnees.</div>';
      const days=s.last_7_days||[];let max=1;days.forEach(function(x){max=Math.max(max,Number(x.sales||0))});
      const bars=days.map(function(x){const h=Math.max(4,Math.round(Number(x.sales||0)/max*100));const d=new Date(x.day_date);return '<div class="sl60BarCol"><div class="sl60Bar" style="height:'+h+'px"></div><b>'+Number(x.orders||0)+'</b><br>'+d.toLocaleDateString('fr-MA',{weekday:'short'})+'</div>'}).join('');
      box.innerHTML='<div class="sl60AnalyticsGrid"><div class="sl60Metric"><b>'+money(s.sales_today||0)+'</b><span>Ventes aujourd hui</span></div><div class="sl60Metric"><b>'+money(s.sales_month||0)+'</b><span>Ventes ce mois</span></div><div class="sl60Metric"><b>'+Number(s.verified_today||0)+'</b><span>Commandes verifiees aujourd hui</span></div><div class="sl60Metric"><b>'+Number(s.pending_verification||0)+'</b><span>En attente OTP</span></div></div><div class="panel"><div class="panelHead"><h3>Top produits</h3><span class="sub">Commandes verifiees</span></div><div class="sl60TopProducts">'+top+'</div></div><div class="panel"><div class="panelHead"><h3>7 derniers jours</h3><span class="sub">Commandes / ventes</span></div><div class="sl60Bars">'+bars+'</div></div>';
    }catch(e){box.innerHTML='<div class="panel"><p class="sub">Stats indisponibles pour le moment.</p></div>'}
  }

  window.sl60TrackPage=function(){
    app.innerHTML='<div class="sl60TrackPage"><div class="storeNav"><div class="container">'+brand()+'<div class="storeNavActions"><button class="btn soft" onclick="go(\'home\')">Accueil</button></div></div></div><section class="sl60TrackHero"><div class="container"><span class="badge">Suivi commande</span><h1>Ou en est votre commande ?</h1><p>Entrez le numero de commande et le meme numero de telephone utilise lors de la commande.</p></div></section><main class="container"><div class="sl60TrackCard"><div class="sl60TrackForm"><input id="sl60TrackRef" placeholder="Ex: BFDAFE5E" maxlength="10"><input id="sl60TrackPhone" inputmode="tel" placeholder="06XXXXXXXX"><button id="sl60TrackBtn" class="btn primary" onclick="sl60TrackSubmit()">Suivre</button></div><div id="sl60TrackResult"></div></div></main></div>';
  };
  window.sl60TrackSubmit=async function(){
    const ref=(document.querySelector('#sl60TrackRef')?.value||'').trim(),phone=(document.querySelector('#sl60TrackPhone')?.value||'').trim();
    if(!ref||!phone)return toast('Ajoutez le numero de commande et le telephone.');
    setBusy('#sl60TrackBtn',true,'Recherche...');
    try{

      const reportRows=reports.map(function(r){return '<button type="button" class="sl70ReportRow" onclick="sl70OpenReport(\''+r.id+'\')"><div><b>'+esc(r.boutique_name||'Boutique')+'</b><span class="sl70Status '+esc(r.status||'open')+'">'+sl70StatusLabel(r.status||'open')+'</span></div><div>'+esc(r.reason||'autre')+' • '+formatDate(r.created_at)+'</div><div class="sub">'+esc(r.details||'Sans detail')+'</div><div class="sl70ReportMeta">'+(r.reporter_user_id?('Par '+esc(r.reporter_name||r.reporter_email||'Utilisateur')):'Anonyme')+' • '+Number(r.reply_count||0)+' réponse(s)</div></button>'}).join('')||'<div class="empty">Aucun signalement.</div>';
      const paymentRows=payments.slice(0,100).map(function(p){return '<tr><td>'+esc(p.boutique_name||'Boutique')+'</td><td><b>'+money(p.amount||0)+'</b></td><td>'+esc(p.status||'pending')+'</td><td>'+formatDate(p.unlock_date||p.created_at)+'</td></tr>'}).join('');
      m.innerHTML='<div class="topRow"><div><h1>Administration</h1><div class="sub">Controle global ShopLink Maroc</div></div><button class="btn soft" onclick="sl60RenderAdmin()">Actualiser</button></div><div class="sl60AnalyticsGrid" style="margin-top:18px"><div class="sl60Metric"><b>'+Number((users.stats||{}).users_total||0)+'</b><span>Utilisateurs</span></div><div class="sl60Metric"><b>'+Number((d.stats||{}).shops_total||0)+'</b><span>Boutiques</span></div><div class="sl60Metric"><b>'+Number((risk.stats||{}).suspicious||0)+'</b><span>Numeros suspects</span></div><div class="sl60Metric"><b>'+Number((risk.stats||{}).blocked||0)+'</b><span>Numeros bloques</span></div></div><div class="sl60AdminTabs"><button class="btn soft active" data-tab="shops" onclick="sl60AdminTab(\'shops\')">Boutiques</button><button class="btn soft" data-tab="users" onclick="sl60AdminTab(\'users\')">Utilisateurs</button><button class="btn soft" data-tab="risk" onclick="sl60AdminTab(\'risk\')">Anti-fake</button><button class="btn soft" data-tab="payments" onclick="sl60AdminTab(\'payments\')">Paiements</button><button class="btn soft" data-tab="reports" onclick="sl60AdminTab(\'reports\')">Signalements</button></div><div class="panel" data-sl60-panel="shops"><div class="tableWrap"><table class="table"><thead><tr><th>Boutique</th><th>Vendeur</th><th>Activite</th><th>Etat</th><th>Action</th></tr></thead><tbody>'+shopRows+'</tbody></table></div></div><div class="panel" data-sl60-panel="users" style="display:none"><div class="tableWrap"><table class="table"><thead><tr><th>Utilisateur</th><th>Boutique</th><th>Inscription</th><th>Etat</th><th>5 DH</th><th>Actions</th></tr></thead><tbody>'+userRows+'</tbody></table></div></div><div class="panel" data-sl60-panel="risk" style="display:none"><div class="tableWrap"><table class="table"><thead><tr><th>Client</th><th>Score</th><th>Historique</th><th>Etat</th><th>Action</th></tr></thead><tbody>'+riskRows+'</tbody></table></div></div><div class="panel" data-sl60-panel="payments" style="display:none"><div class="tableWrap"><table class="table"><thead><tr><th>Boutique</th><th>Montant</th><th>Statut</th><th>Date</th></tr></thead><tbody>'+paymentRows+'</tbody></table></div></div><div class="panel" data-sl60-panel="reports" style="display:none">'+reportRows+'</div>';

<script id="sl70-report-script">
(function(){
  window.sl70StatusLabel=function(s){return ({open:'Nouveau',in_review:'En cours',resolved:'Résolu',closed:'Fermé'})[s]||'Nouveau'};

  window.sl70OpenReport=async function(id){
    try{
      const data=await api('/rest/v1/rpc/get_admin_report_thread',{method:'POST',auth:true,body:{p_report_id:id}});
      const r=data.report||{},replies=data.replies||[];
      document.querySelector('#sl70ReportModal')?.remove();
      document.body.insertAdjacentHTML('beforeend',
        '<div class="modal" id="sl70ReportModal"><div class="modalBox">'+
        '<div class="panelHead"><div><h2>Signalement</h2><div class="sub">'+esc(r.boutique_name||'Boutique')+'</div></div><button class="modalX" onclick="document.querySelector(\'#sl70ReportModal\').remove()">×</button></div>'+
        '<div class="sl70ReportDetails"><b>'+esc(r.reason||'autre')+'</b><br>'+esc(r.details||'Sans détail')+'<br><span class="sub">'+formatDate(r.created_at)+'</span>'+(r.page_url?'<br><a href="'+attr(r.page_url)+'" target="_blank" rel="noopener">Ouvrir la page signalée</a>':'')+'</div>'+
        '<div class="sl70ReportDetails"><b>Expéditeur</b><br>'+(r.reporter_user_id?(esc(r.reporter_name||'Utilisateur')+(r.reporter_email?'<br><span class="sub">'+esc(r.reporter_email)+'</span>':'')):'<span class="sub">Signalement anonyme — impossible d’envoyer une réponse à cette personne.</span>')+'</div>'+
        '<div class="sl70Thread"><b>Réponses de l’administration</b>'+(replies.length?replies.map(function(x){return '<div class="sl70Reply"><b>'+esc(x.admin_name||'Administration')+'</b><div>'+esc(x.message||'')+'</div><span class="sub">'+formatDate(x.created_at)+'</span></div>'}).join(''):'<div class="sub">Aucune réponse pour le moment.</div>')+'</div>'+
        (r.reporter_user_id?'<div class="sl70ReplyBox"><select id="sl70ReportStatus"><option value="in_review" '+(r.status==='in_review'?'selected':'')+'>En cours</option><option value="resolved" '+(r.status==='resolved'?'selected':'')+'>Résolu</option><option value="closed" '+(r.status==='closed'?'selected':'')+'>Fermé</option><option value="open" '+(r.status==='open'?'selected':'')+'>Nouveau</option></select><textarea id="sl70ReportReply" rows="4" maxlength="2000" placeholder="Écrire une réponse à cette personne..."></textarea><button class="btn primary" onclick="sl70SendReportReply(\''+id+'\')">Envoyer la réponse</button></div>':'')+
        '</div></div>'
      );
    }catch(e){toast(friendlyError(e))}
  };

  window.sl70SendReportReply=async function(id){
    const msg=document.querySelector('#sl70ReportReply')?.value.trim()||'';
    const status=document.querySelector('#sl70ReportStatus')?.value||'in_review';
    if(!msg)return toast('Écrivez une réponse.');
    try{
      await api('/rest/v1/rpc/admin_reply_report',{method:'POST',auth:true,body:{p_report_id:id,p_message:msg,p_status:status}});
      toast('Réponse envoyée ✅');
      await sl70OpenReport(id);
    }catch(e){toast(friendlyError(e))}
  };

  window.sl70LoadMyReports=async function(){
    const m=document.querySelector('#dashMain');if(!m||!state.user)return;
    let box=m.querySelector('#sl70MyReports');
    if(!box){box=document.createElement('div');box.id='sl70MyReports';box.className='panel';box.innerHTML='<h3>Mes signalements</h3><div class="empty">Chargement...</div>';m.appendChild(box)}
    try{
      const data=await api('/rest/v1/rpc/get_my_reports',{method:'POST',auth:true,body:{}});
      const items=data.items||[];
      box.innerHTML='<div class="panelHead"><div><h3>Mes signalements</h3><div class="sub">Réponses de l’administration ShopLink Maroc</div></div><span class="sl70Status">'+items.length+'</span></div>'+
        (items.length?items.map(function(r){
          const reps=r.replies||[];
          return '<div class="sl70MyReport"><div class="sl70MyReportHead"><div><b>'+esc(r.boutique_name||'Boutique')+'</b><div class="sub">'+esc(r.reason||'autre')+' • '+formatDate(r.created_at)+'</div></div><span class="sl70Status '+esc(r.status||'open')+'">'+sl70StatusLabel(r.status||'open')+'</span></div><div style="margin-top:8px">'+esc(r.details||'')+'</div>'+(reps.length?'<div class="sl70MyReplies">'+reps.map(function(x){return '<div><b>Administration</b><div>'+esc(x.message||'')+'</div><span class="sub">'+formatDate(x.created_at)+'</span></div>'}).join('')+'</div>':'<div class="sub" style="margin-top:8px">Pas encore de réponse.</div>')+'</div>'
        }).join(''):'<div class="empty">Vous n’avez encore envoyé aucun signalement avec ce compte.</div>');
      await api('/rest/v1/rpc/mark_my_report_replies_seen',{method:'POST',auth:true,body:{}});
      sl70SetAccountBadge(0);
    }catch(e){box.innerHTML='<h3>Mes signalements</h3><p class="sub">'+esc(friendlyError(e))+'</p>'}
  };

  window.sl70SetAccountBadge=function(n){
    const b=document.querySelector('.sidebar [data-tab="account"]');if(!b)return;
    b.querySelector('.sl70AccountBadge')?.remove();
    if(Number(n)>0)b.insertAdjacentHTML('beforeend','<span class="sl70AccountBadge">'+Number(n)+'</span>');
  };

  window.sl70RefreshReportBadge=async function(){
    if(!state.user)return;
    try{
      const data=await api('/rest/v1/rpc/get_my_reports',{method:'POST',auth:true,body:{}});
      sl70SetAccountBadge(Number(data.unread_count||0));
    }catch{}
  };

  const SL70_DASH=window.dashboard;
  window.dashboard=function(){SL70_DASH();setTimeout(sl70RefreshReportBadge,80)};
  dashboard=window.dashboard;

  const SL70_TAB=window.dashTab;
  window.dashTab=function(tab,btn){SL70_TAB(tab,btn);if(tab==='account')setTimeout(sl70LoadMyReports,30)};
  dashTab=window.dashTab;
})();
</script>

<script id="sl85-categories-policy">
(function(){
  const disallowedLocal=/(^|[^a-z0-9_])(pistolet|revolver|fusil|arme a feu|arme à feu|firearm|gun|munition|munitions|ammunition|silencieux|silencer|grenade|dynamite|explosif|explosive|fireworks|cocaine|cocaïne|heroine|héroïne|methamphetamine|mdma|ecstasy|lsd|cannabis|marijuana|hashish|haschich|thc|psilocybin|cigarette|cigarettes|vape|vapotage|nicotine|tabac|vodka|whisky|whiskey|rhum|rum|beer|biere|bière|wine|vin|spyware|stalkerware|keylogger|malware|cyanure|cyanide|ricin|ivoire|ivory)([^a-z0-9_]|$)/i;

  window.sl85PolicyModal=function(){
    document.querySelector('#sl85PolicyModal')?.remove();
    document.body.insertAdjacentHTML('beforeend',
      '<div class="modal" id="sl85PolicyModal"><div class="modalBox">'+
      '<div class="panelHead"><div><h2>Règles de vente ShopLink Maroc</h2><div class="sub">Les vendeurs doivent proposer uniquement des produits et services autorisés.</div></div><button class="modalX" onclick="document.querySelector(\'#sl85PolicyModal\').remove()">×</button></div>'+
      '<div class="sl85-policyList">'+
      '<div><b>Interdits :</b> armes et explosifs, drogues, alcool et nicotine, médicaments/substances réglementés, produits dangereux.</div>'+
      '<div><b>Interdits :</b> contrefaçons, produits volés, fausse monnaie, contenus ou produits sexuels explicites, jeux d’argent et services de pari.</div>'+
      '<div><b>Interdits :</b> logiciels malveillants/espions et commerce illégal d’espèces protégées ou produits issus de la faune protégée.</div>'+
      '<div><b>Animaux de compagnie :</b> nourriture, accessoires, services et annonces légales sont permis. Les espèces protégées et le trafic d’animaux sont interdits.</div>'+
      '<div><b>Modération :</b> toute annonce peut être signalée. ShopLink peut masquer ou supprimer une annonce et bloquer un compte en cas d’abus.</div>'+
      '</div>'+
      '<button class="btn primary full" onclick="document.querySelector(\'#sl85PolicyModal\').remove()">J’ai compris</button>'+
      '</div></div>'
    );
  };

  const oldOpen=window.openProductModal||openProductModal;
  window.openProductModal=function(id=''){
    oldOpen(id);
    setTimeout(function(){
      const modal=document.querySelector('#modal .modalBox');
      if(!modal||modal.querySelector('#sl85PolicyAgree'))return;
      const actions=modal.querySelector('.modalActions');
      if(!actions)return;
      actions.insertAdjacentHTML('beforebegin',
        '<div class="sl85-policyBox"><label><input type="checkbox" id="sl85PolicyAgree"> <span>Je confirme que ce produit/service respecte les règles ShopLink Maroc et n’est pas interdit. <button type="button" onclick="sl85PolicyModal()">Voir les règles</button></span></label></div>'
      );
    },0);
  };
  openProductModal=window.openProductModal;

  const oldSave=window.saveProduct||saveProduct;
  window.saveProduct=async function(id=''){
    if(!document.querySelector('#sl85PolicyAgree')?.checked){
      return toast('Confirmez d’abord que le produit respecte les règles de vente.');
    }
    const name=document.querySelector('#pName')?.value.trim()||'';
    const description=document.querySelector('#pDesc')?.value.trim()||'';
    const category=document.querySelector('#pCategory')?.value||'Autre';

    if(disallowedLocal.test((name+' '+description+' '+category).toLowerCase())){
      return toast('Ce produit ou service n’est pas autorisé sur ShopLink Maroc.');
    }

    if(REMOTE){
      try{
        const check=await api('/rest/v1/rpc/check_product_policy',{method:'POST',auth:true,body:{p_name:name,p_description:description,p_category:category}});
        if(check&&check.allowed===false)return toast('Ce produit ou service n’est pas autorisé sur ShopLink Maroc.');
      }catch(e){
        if(/product_not_allowed/i.test(String(e?.message||e||'')))return toast('Ce produit ou service n’est pas autorisé sur ShopLink Maroc.');
        throw e;
      }
    }
    return oldSave(id);
  };
  saveProduct=window.saveProduct;

  // Final catalogue renderer: keep current shop behavior and add per-product reporting.
  window.catalogCards=function(products){
    return (products||[]).map(function(p){
      const service=(p.category||'').toLowerCase()==='services'&&(p.stock===null||p.stock===undefined);
      const disabled=!state.publicShop.is_open||(!service&&p.stock!==null&&Number(p.stock)<=0);
      return '<article class="catalogCard" data-cat="'+attr(p.category||'')+'">'+
        (p.image_url?'<div class="catalogImg photo"><img src="'+attr(p.image_url)+'" alt="'+attr(p.name)+'"></div>':'<div class="catalogImg">'+esc(p.emoji||'📦')+'</div>')+
        '<div class="catalogBody"><div class="catalogCategory">'+(service?'🧰 Service':esc(p.category||''))+'</div>'+
        '<h3>'+esc(p.name)+'</h3><p>'+esc(p.description||(service?'Service disponible':'Produit disponible'))+'</p>'+
        '<div class="catalogBottom"><div><b class="price">'+money(p.price)+'</b>'+
        (service?'<small class="stock">Sur demande</small>':(p.stock!==null&&p.stock!==undefined?'<small class="stock">'+(Number(p.stock)>0?Number(p.stock)+' en stock':'Rupture')+'</small>':''))+
        '</div><button class="btn primary" '+(disabled?'disabled':'')+' onclick="addCartById(\''+String(p.id).replace(/'/g,'')+'\')">'+(service?'Choisir':'Ajouter')+'</button></div>'+
        '<button type="button" class="sl85-reportProduct" onclick="event.stopPropagation();slsecReport(\''+String(p.id).replace(/'/g,'')+'\')">⚑ Signaler ce produit</button>'+
        '</div></article>';
    }).join('');
  };
  catalogCards=window.catalogCards;

  const oldLanding=window.landing;
  if(oldLanding){
    window.landing=function(){
      oldLanding();
      const links=document.querySelector('.sl60FooterLinks')||document.querySelector('.footer');
      if(links&&!links.querySelector('.sl85-rules-link')){
        const b=document.createElement('button');
        b.className='sl85-rules-link';
        b.textContent='Règles de vente';
        b.onclick=sl85PolicyModal;
        links.appendChild(b);
      }
    };
    landing=window.landing;
  }
})();
</script>

<script id="sl86-account-reviews-socials">
(function(){
  const SL86={reviewContext:null,publicReviews:null,socials:null};
  window.SL86=SL86;

  const oldFriendly=window.friendlyError;
  window.friendlyError=function(e){
    const m=String(e?.message||e||'');
    if(/review_requires_verified_order/i.test(m))return 'La commande doit d’abord être vérifiée par code.';
    if(/review_cancelled_order/i.test(m))return 'Une commande annulée ne peut pas recevoir un avis.';
    if(/review_order_not_found/i.test(m))return 'Commande introuvable pour ce numéro.';
    if(/invalid_rating/i.test(m))return 'Choisissez une note de 1 à 5 étoiles.';
    if(/review_not_found/i.test(m))return 'Avis introuvable.';if(/admin_account_protected/i.test(m))return 'Compte administrateur protégé : il ne peut pas être supprimé.';
    return oldFriendly?oldFriendly(e):m;
  };
  friendlyError=window.friendlyError;

  function sl86Stars(n){
    const x=Math.max(0,Math.min(5,Math.round(Number(n)||0)));
    return '★'.repeat(x)+'☆'.repeat(5-x);
  }
  function sl86SocialUrl(raw,type){
    let v=String(raw||'').trim();
    if(!v)return '';
    if(type==='instagram'){
      if(v.startsWith('@'))v='https://instagram.com/'+v.slice(1);
      else if(!/^https?:\/\//i.test(v))v='https://instagram.com/'+v.replace(/^\/+|\/+$/g,'');
    }
    if(type==='facebook'){
      if(v.startsWith('@'))v=v.slice(1);
      if(!/^https?:\/\//i.test(v))v='https://facebook.com/'+v.replace(/^\/+|\/+$/g,'');
    }
    if(type==='tiktok'){
      if(!/^https?:\/\//i.test(v)){
        const h=v.replace(/^@/,'').replace(/^\/+|\/+$/g,'');
        v='https://tiktok.com/@'+h;
      }
    }
    try{
      const u=new URL(v);
      const h=u.hostname.replace(/^www\./,'').toLowerCase();
      const ok=type==='instagram'?h==='instagram.com'||h.endsWith('.instagram.com'):
               type==='facebook'?h==='facebook.com'||h.endsWith('.facebook.com')||h==='fb.com':
               h==='tiktok.com'||h.endsWith('.tiktok.com');
      return ok?u.href:'';
    }catch{return ''}
  }

  window.sl86EnhanceAccount=async function(){
    const m=document.querySelector('#dashMain');
    if(!m||m.querySelector('#sl86AccountExtras'))return;
    const host=m.querySelector('.slxAccount')||m.querySelector('.panel');
    if(!host)return;

    let isAdmin=false;
    if(REMOTE&&state.user){
      try{isAdmin=await api('/rest/v1/rpc/is_platform_admin',{method:'POST',auth:true,body:{}})===true}catch{}
    }

    host.insertAdjacentHTML('afterend',
      '<div id="sl86AccountExtras">'+
      '<div class="panel"><h3>Changer l\'e-mail</h3><p class="sub">Un lien de confirmation sera envoyé avant que la nouvelle adresse soit utilisée.</p><div class="field"><label>Nouvel e-mail</label><input id="sl86Email" type="email" value="'+attr(state.user?.email||'')+'" placeholder="vous@email.com"></div><button id="sl86EmailBtn" class="btn soft" onclick="sl86ChangeEmail()">Changer l\'e-mail</button></div>'+
      (isAdmin
        ?'<div class="panel"><h3>🛡️ Compte administrateur protégé</h3><p class="sub">Had compte howa compte admin dyal ShopLink Maroc. Suppression automatique msdoda bach ma ytms7ch l’accès administrateur.</p><button class="btn soft" disabled>Suppression désactivée</button></div>'
        :'<div class="panel sl86-danger"><h3>Supprimer mon compte</h3><p class="sub">Cette action supprime votre boutique, vos produits et les données vendeur liées au compte. Elle est irréversible.</p><button id="sl86DeleteBtn" class="btn soft" onclick="sl86DeleteAccount()">Supprimer mon compte</button></div>')+
      '</div>'
    );
  };

  window.sl86ChangeEmail=async function(){
    const email=(document.querySelector('#sl86Email')?.value||'').trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Entrez un e-mail valide.');
    if(email===String(state.user?.email||'').toLowerCase())return toast('C’est déjà votre e-mail actuel.');
    setBusy('#sl86EmailBtn',true,'Envoi…');
    try{
      const token=await validToken();if(!token)throw new Error('Session expirée.');
      const r=await fetch(SUPABASE_URL+'/auth/v1/user',{
        method:'PUT',
        headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},
        body:JSON.stringify({email})
      });
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.msg||d.message||'Impossible de modifier l\'e-mail.');
      toast('Confirmation envoyée. Validez le nouvel e-mail avant le changement.');
    }catch(e){toast(friendlyError(e))}
    finally{setBusy('#sl86EmailBtn',false,'Changer l\'e-mail')}
  };

  window.sl86DeleteAccount=async function(){
    if(!confirm('Supprimer définitivement votre compte ShopLink Maroc ?'))return;
    const word=prompt('Écrivez SUPPRIMER pour confirmer :','');
    if(word!=='SUPPRIMER')return toast('Suppression annulée.');
    setBusy('#sl86DeleteBtn',true,'Suppression…');
    try{
      await api('/rest/v1/rpc/delete_my_account',{method:'POST',auth:true,body:{}});
      state.session=null;state.user=null;state.shop={...defaults.shop};state.products=[];state.orders=[];
      try{
        ['sl_session','sl_user','sl_shop','sl_products','sl_orders','sl41_template','sl54_pending_order'].forEach(k=>localStorage.removeItem(k));
        sessionStorage.clear();
      }catch{}
      toast('Compte supprimé.');
      setTimeout(()=>go('home'),500);
    }catch(e){toast(friendlyError(e));setBusy('#sl86DeleteBtn',false,'Supprimer mon compte')}
  };

  window.sl86EnhanceShop=function(){
    const m=document.querySelector('#dashMain');
    if(!m||m.querySelector('#sl86SocialPanel'))return;
    m.insertAdjacentHTML('beforeend',
      '<div class="panel sl86-socialPanel" id="sl86SocialPanel"><div class="panelHead"><div><h3>Réseaux & contact</h3><div class="sub">Ajoutez vos liens publics. Le WhatsApp utilise le numéro déjà enregistré dans Ma boutique.</div></div></div>'+
      '<div class="sl86-grid2">'+
      '<div class="field"><label>Instagram</label><input id="sl86Instagram" value="'+attr(state.shop?.instagram_url||'')+'" placeholder="@votrecompte ou lien Instagram"><small>Ex: @ma_boutique</small></div>'+
      '<div class="field"><label>Facebook</label><input id="sl86Facebook" value="'+attr(state.shop?.facebook_url||'')+'" placeholder="Page Facebook ou lien"><small>Ex: facebook.com/maboutique</small></div>'+
      '<div class="field"><label>TikTok</label><input id="sl86Tiktok" value="'+attr(state.shop?.tiktok_url||'')+'" placeholder="@votrecompte ou lien TikTok"><small>Ex: @ma_boutique</small></div>'+
      '<div class="field"><label>WhatsApp</label><input value="'+attr(state.shop?.phone||'')+'" disabled><small>Changez ce numéro dans le champ Téléphone / WhatsApp plus haut.</small></div>'+
      '</div><button id="sl86SocialSave" class="btn primary" onclick="sl86SaveSocials()">Enregistrer les réseaux</button></div>'
    );
  };

  window.sl86SaveSocials=async function(){
    const instagram_url=sl86SocialUrl(document.querySelector('#sl86Instagram')?.value,'instagram');
    const facebook_url=sl86SocialUrl(document.querySelector('#sl86Facebook')?.value,'facebook');
    const tiktok_url=sl86SocialUrl(document.querySelector('#sl86Tiktok')?.value,'tiktok');
    const rawI=(document.querySelector('#sl86Instagram')?.value||'').trim();
    const rawF=(document.querySelector('#sl86Facebook')?.value||'').trim();
    const rawT=(document.querySelector('#sl86Tiktok')?.value||'').trim();
    if(rawI&&!instagram_url)return toast('Lien ou compte Instagram invalide.');
    if(rawF&&!facebook_url)return toast('Lien ou page Facebook invalide.');
    if(rawT&&!tiktok_url)return toast('Lien ou compte TikTok invalide.');
    setBusy('#sl86SocialSave',true,'Enregistrement…');
    try{
      if(REMOTE){
        const rows=await api('/rest/v1/shops?id=eq.'+encodeURIComponent(state.shop.id)+'&select=*',{
          method:'PATCH',auth:true,headers:{Prefer:'return=representation'},
          body:{instagram_url,facebook_url,tiktok_url}
        });
        state.shop=normalizeShop(rows[0]);
      }else{
        state.shop={...state.shop,instagram_url,facebook_url,tiktok_url};
        DB.set('sl_shop',state.shop);
      }
      toast('Réseaux enregistrés ✅');
      sl86EnhanceShop();
    }catch(e){toast(friendlyError(e))}
    finally{setBusy('#sl86SocialSave',false,'Enregistrer les réseaux')}
  };

  window.sl86RenderPublicExtras=function(){
    const s=SL86.socials||{};
    const head=document.querySelector('.shopHeadInner>div:last-child');
    if(head){
      head.querySelector('.sl86-socials')?.remove();
      const links=[];
      if(s.instagram_url)links.push('<a href="'+attr(s.instagram_url)+'" target="_blank" rel="noopener">Instagram</a>');
      if(s.facebook_url)links.push('<a href="'+attr(s.facebook_url)+'" target="_blank" rel="noopener">Facebook</a>');
      if(s.tiktok_url)links.push('<a href="'+attr(s.tiktok_url)+'" target="_blank" rel="noopener">TikTok</a>');
      const w=typeof wa==='function'?wa(s.whatsapp||''):'';
      if(w)links.push('<a href="'+attr(w)+'" target="_blank" rel="noopener">WhatsApp</a>');
      if(links.length)head.insertAdjacentHTML('beforeend','<div class="sl86-socials">'+links.join('')+'</div>');
    }

    const old=document.querySelector('#sl86ReviewsSection');if(old)old.remove();
    const data=SL86.publicReviews||{average:0,count:0,reviews:[]};
    const main=document.querySelector('.storePage main.catalog');
    if(!main)return;
    const reviews=Array.isArray(data.reviews)?data.reviews:[];
    const cards=reviews.length?reviews.map(r=>
      '<div class="sl86-reviewCard"><div class="sl86-stars">'+sl86Stars(r.rating)+'</div><b>'+esc(r.reviewer_name||'Client vérifié')+'</b><small> • Achat vérifié</small>'+
      (r.comment?'<p>'+esc(r.comment)+'</p>':'')+
      '<small>'+formatDate(r.created_at)+'</small></div>'
    ).join(''):'<div class="empty">Pas encore d\'avis vérifiés.</div>';
    main.insertAdjacentHTML('afterend',
      '<section class="sl86-reviews" id="sl86ReviewsSection"><div class="container">'+
      '<div class="sl86-reviewHead"><div><h2>Avis clients</h2><div class="sub">Uniquement après vérification de la commande.</div><button class="btn primary" style="margin-top:12px" onclick="sl86StartReviewFromShop()">Laisser un avis ⭐</button></div>'+
      '<div><span class="sl86-score">'+Number(data.average||0).toFixed(1)+'/5</span> <span class="sl86-stars">'+sl86Stars(data.average||0)+'</span><div class="sub">'+Number(data.count||0)+' avis</div></div></div>'+
      '<div class="sl86-reviewGrid">'+cards+'</div></div></section>'
    );
  };

  const oldPublicStore=window.publicStore||publicStore;
  window.publicStore=async function(slug){
    const r=await oldPublicStore(slug);
    if(!REMOTE||!state.publicShop?.id||state.publicShop.id==='demo')return r;
    try{
      const all=await Promise.all([
        api('/rest/v1/rpc/get_public_shop_socials',{method:'POST',body:{p_shop_id:state.publicShop.id}}),
        api('/rest/v1/rpc/get_public_shop_reviews',{method:'POST',body:{p_shop_id:state.publicShop.id}})
      ]);
      SL86.socials=all[0]||{};
      SL86.publicReviews=all[1]||{average:0,count:0,reviews:[]};
      sl86RenderPublicExtras();
    }catch{}
    return r;
  };
  publicStore=window.publicStore;


  window.sl86StartReviewFromShop=function(){
    document.querySelector('#sl86ReviewVerifyModal')?.remove();
    document.body.insertAdjacentHTML('beforeend',
      '<div class="modal" id="sl86ReviewVerifyModal"><div class="modalBox">'+
      '<div class="panelHead"><div><h2>Laisser un avis</h2><div class="sub">Entrez les informations de votre commande vérifiée.</div></div><button class="modalX" onclick="document.querySelector(\'#sl86ReviewVerifyModal\').remove()">×</button></div>'+
      '<div class="field"><label>Numéro de commande</label><input id="sl86ReviewRef" maxlength="12" placeholder="Ex: FB9DD8AC" autocomplete="off"></div>'+
      '<div class="field"><label>Téléphone utilisé pour la commande</label><input id="sl86ReviewPhone" inputmode="tel" autocomplete="tel" placeholder="06XXXXXXXX"></div>'+
      '<button id="sl86ReviewCheckBtn" class="btn primary full" onclick="sl86CheckReviewOrder()">Vérifier ma commande</button>'+
      '<p class="sub" style="margin-top:10px">Seules les commandes avec numéro de téléphone vérifié peuvent publier un avis.</p>'+
      '</div></div>'
    );
  };

  window.sl86CheckReviewOrder=async function(){
    const ref=(document.querySelector('#sl86ReviewRef')?.value||'').trim().toUpperCase().replace(/[^A-F0-9]/g,'');
    const phone=(document.querySelector('#sl86ReviewPhone')?.value||'').trim();
    if(ref.length!==8)return toast('Entrez le numéro de commande à 8 caractères.');
    if(!/^0[67]\d{8}$/.test(phone.replace(/\s+/g,'')))return toast('Entrez le même numéro utilisé pour la commande.');
    setBusy('#sl86ReviewCheckBtn',true,'Vérification…');
    try{
      const e=await api('/rest/v1/rpc/get_review_eligibility',{method:'POST',body:{p_order_number:ref,p_phone:phone}});
      if(!e?.allowed){
        if(e?.phone_verified===false)return toast('Cette commande n’est pas encore vérifiée par code.');
        return toast('Cette commande ne peut pas encore recevoir un avis.');
      }
      if(String(e.shop_id||'')!==String(state.publicShop?.id||''))return toast('Cette commande appartient à une autre boutique.');
      document.querySelector('#sl86ReviewVerifyModal')?.remove();
      sl86OpenReview(ref,phone,e.existing||null);
    }catch(err){toast(friendlyError(err));setBusy('#sl86ReviewCheckBtn',false,'Vérifier ma commande')}
  };

  window.sl86OpenReview=function(ref,phone,existing){
    SL86.reviewContext={ref,phone,rating:Number(existing?.rating||0)};
    document.querySelector('#sl86ReviewModal')?.remove();
    document.body.insertAdjacentHTML('beforeend',

  const oldTrack=window.sl60TrackSubmit;

          if(b)b.onclick=function(){sl86OpenReview(ref,phone,existing)};
        }
      }catch{}
      return r;
    };
    sl60TrackSubmit=window.sl60TrackSubmit;
  }

  window.sl86LoadSellerReviews=async function(){
    const m=document.querySelector('#dashMain');if(!m||m.querySelector('#sl86SellerReviews')||!REMOTE)return;
    try{
      const d=await api('/rest/v1/rpc/get_seller_review_stats',{method:'POST',auth:true,body:{}});
      const rows=Array.isArray(d.reviews)?d.reviews:[];
      const cards=rows.length?rows.slice(0,5).map(r=>
        '<div class="sl86-reviewCard"><div class="sl86-stars">'+sl86Stars(r.rating)+'</div><b>'+esc(r.reviewer_name||'Client vérifié')+'</b>'+
        (r.comment?'<p>'+esc(r.comment)+'</p>':'')+'<small>'+formatDate(r.created_at)+(r.status==='hidden'?' • Masqué':'')+'</small></div>'
      ).join(''):'<div class="empty">Pas encore d\'avis.</div>';
      m.insertAdjacentHTML('beforeend','<div class="panel" id="sl86SellerReviews"><div class="panelHead"><div><h3>Avis clients</h3><div class="sub">Avis liés à des commandes vérifiées</div></div><div><b style="font-size:24px">'+Number(d.average||0).toFixed(1)+'/5</b><div class="sub">'+Number(d.count||0)+' avis publiés</div></div></div><div class="sl86-reviewGrid">'+cards+'</div></div>');
    }catch{}
  };

  window.sl86AppendAdminReviews=async function(){
    const m=document.querySelector('#dashMain');if(!m||m.querySelector('#sl86AdminReviews')||!REMOTE)return;
    try{
      const rows=await api('/rest/v1/rpc/get_admin_reviews',{method:'POST',auth:true,body:{}});
      const list=Array.isArray(rows)?rows:[];
      const body=list.length?list.map(r=>
        '<div class="sl86-reviewAdminRow"><div class="sl86-reviewAdminHead"><div><b>'+esc(r.shop_name||'Boutique')+'</b> <span class="sub">#'+esc(r.order_number||'')+'</span><div class="sl86-stars">'+sl86Stars(r.rating)+'</div></div><span class="sl41-adminBadge '+(r.status==='hidden'?'off':'')+'">'+(r.status==='hidden'?'Masqué':'Publié')+'</span></div>'+
        '<p>'+esc(r.comment||'Sans commentaire')+'</p><div class="sub">'+esc(r.reviewer_name||'Client vérifié')+' • '+formatDate(r.created_at)+'</div>'+
        '<div style="margin-top:10px"><button class="btn soft sl41-mini" onclick="sl86ModerateReview(\''+r.id+'\',\''+(r.status==='hidden'?'published':'hidden')+'\')">'+(r.status==='hidden'?'Republier':'Masquer')+'</button></div></div>'
      ).join(''):'<div class="empty">Aucun avis pour le moment.</div>';
      m.insertAdjacentHTML('beforeend','<div class="panel" id="sl86AdminReviews"><div class="panelHead"><div><h3>Modération des avis</h3><div class="sub">Avis provenant uniquement de commandes vérifiées.</div></div></div><div class="sl86-reviewAdmin">'+body+'</div></div>');
    }catch{}
  };

  window.sl86ModerateReview=async function(id,status){
    try{
      await api('/rest/v1/rpc/admin_set_review_status',{method:'POST',auth:true,body:{p_review_id:id,p_status:status}});
      document.querySelector('#sl86AdminReviews')?.remove();
      await sl86AppendAdminReviews();
      toast(status==='hidden'?'Avis masqué':'Avis republié');
    }catch(e){toast(friendlyError(e))}
  };

  const oldTab=window.dashTab||dashTab;
  window.dashTab=function(tab,btn){
    const r=oldTab(tab,btn);
    Promise.resolve(r).then(function(){
      if(tab==='account')setTimeout(sl86EnhanceAccount,20);
      if(tab==='shop')setTimeout(sl86EnhanceShop,20);
      if(tab==='overview')setTimeout(sl86LoadSellerReviews,80);
      if(tab==='admin')setTimeout(sl86AppendAdminReviews,120);
    });
    return r;
  };
  dashTab=window.dashTab;

  // If current screen was already rendered before this final enhancement loaded.
  setTimeout(function(){
    if(document.querySelector('[data-tab="account"].active'))sl86EnhanceAccount();
    if(document.querySelector('[data-tab="shop"].active'))sl86EnhanceShop();
    if(document.querySelector('[data-tab="overview"].active'))sl86LoadSellerReviews();
  },180);
})();
</script>
