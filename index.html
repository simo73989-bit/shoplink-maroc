  const email=$('#resetEmail')?.value.trim(); if(!email)return toast('Entrez votre adresse e-mail.');
  setBusy('#resetBtn',true,'Envoi...');
  try{
    await authRequest('/auth/v1/recover?redirect_to='+encodeURIComponent(AUTH_REDIRECT),{email});
    app.innerHTML=`<div class="authPage"><div class="authCard verifyCard">${brand()}<div class="verifyIcon mail">✉</div><span class="verifyBadge">E-MAIL ENVOYÉ</span><h1>Vérifiez votre boîte mail</h1><p>Si un compte existe pour <b>${esc(email)}</b>, un lien de réinitialisation a été envoyé.</p><div class="switch"><a href="#" onclick="go('login');return false">← Retour à la connexion</a></div></div></div>`;
  }catch(e){toast(friendlyError(e));}
  finally{setBusy('#resetBtn',false,'Envoyer le lien');}
}

function resetPassword(){
  app.innerHTML=`<div class="authPage"><div class="authCard">${brand()}<h1>Nouveau mot de passe</h1><p>Choisissez un mot de passe d’au moins 8 caractères.</p><div class="field"><label>Nouveau mot de passe</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="••••••••"></div><div class="field"><label>Confirmer</label><input id="newPassword2" type="password" autocomplete="new-password" placeholder="••••••••"></div><button id="passwordBtn" class="btn primary full" onclick="updatePassword()">Enregistrer</button></div></div>`;

async function updatePassword(){
  const a=$('#newPassword')?.value||'',b=$('#newPassword2')?.value||'';
  if(a.length<8)return toast('8 caractères minimum.'); if(a!==b)return toast('Les mots de passe ne correspondent pas.');

  setBusy('#passwordBtn',true,'Enregistrement...');
  try{
    const r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:a})});
    const d=await r.json().catch(()=>({})); if(!r.ok)throw new Error(d.msg||d.message||'Impossible de modifier le mot de passe.');
    toast('Mot de passe modifié ✅'); setTimeout(()=>go('dashboard'),700);
  }catch(e){toast(friendlyError(e));}
  finally{setBusy('#passwordBtn',false,'Enregistrer');}
}

async function submitAuth(mode){
  const email=$('#email').value.trim(), pass=$('#password').value;
  const name=mode==='signup'?($('#name').value.trim()||'Vendeur'):'Vendeur';
  if(!email || pass.length<8) return toast('Mot de passe: 8 caractères minimum.');
  if(REMOTE&&!BACKEND_READY) return toast('Service en maintenance. Réessayez dans quelques instants.');
  setBusy('#authBtn', true, mode==='signup'?'Création...':'Connexion...');
  try{
    if(REMOTE){
      if(mode==='signup'){
        const data = await authRequest('/auth/v1/signup?redirect_to='+encodeURIComponent(AUTH_REDIRECT), {email,password:pass,data:{full_name:name}});
        if(!data.access_token){
          history.replaceState(null,'',location.pathname+'#verify-email');
          emailPending(email);
          return;
        }
        state.user={id:data.user.id,name,email}; saveRemoteSession(data);
      } else {
        const data = await authRequest('/auth/v1/token?grant_type=password', {email,password:pass});
        state.user={id:data.user.id,name:data.user.user_metadata?.full_name||'Vendeur',email}; saveRemoteSession(data);
      }
      await loadSellerData(true);
    } else {
      const user={id:'local-user',name,email}; state.user=user; DB.set('sl_user',user);
      if(mode==='signup' && !DB.get('sl_shop_init',false)){
        state.shop={...defaults.shop,slug:slugify(name+' boutique')}; DB.set('sl_shop',state.shop); DB.set('sl_shop_init',true);
      }
    }
    go('dashboard');
  }catch(e){toast(friendlyError(e));}
  finally{setBusy('#authBtn', false, mode==='signup'?"S'inscrire":'Se connecter');}
}

function setBusy(sel,on,text){const el=$(sel); if(!el)return; el.disabled=on; el.textContent=text;}
function friendlyError(e){const m=String(e?.message||e||'Erreur'); if(/Invalid login/i.test(m))return 'Email ou mot de passe incorrect.'; if(/already registered|User already registered/i.test(m))return 'Cet e-mail est déjà utilisé.'; if(/Email not confirmed/i.test(m))return 'Confirmez votre e-mail avant de vous connecter.'; if(/rate limit|too many requests/i.test(m))return 'Trop de tentatives. Réessayez un peu plus tard.'; if(/duplicate key.*slug/i.test(m))return 'Ce lien de boutique est déjà pris.'; if(/stock/i.test(m))return 'Un produit n’est plus disponible en quantité suffisante.'; return m.length>160?'Une erreur est survenue. Réessayez.':m;}

async function authRequest(path, body){
  const r=await fetch(SUPABASE_URL+path,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await r.json().catch(()=>({})); if(!r.ok)throw new Error(data.msg||data.message||data.error_description||'Erreur de connexion'); return data;
}
function saveRemoteSession(data){state.session={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+Number(data.expires_in||3600)*1000}; DB.set('sl_session',state.session); DB.set('sl_user',state.user);}
async function validToken(){
  if(!REMOTE||!state.session)return null;
  if(state.session.expires_at && state.session.expires_at-Date.now()>60000)return state.session.access_token;
  if(!state.session.refresh_token)return null;
  try{const d=await authRequest('/auth/v1/token?grant_type=refresh_token',{refresh_token:state.session.refresh_token}); if(d.user)state.user={id:d.user.id,name:d.user.user_metadata?.full_name||'Vendeur',email:d.user.email}; saveRemoteSession(d); return d.access_token;}catch{return null;}
}

async function api(path,{method='GET',body,auth=false,headers={}}={}){
  const h={apikey:SUPABASE_KEY,'Content-Type':'application/json',...headers};
  if(auth){const token=await validToken(); if(!token)throw new Error('Session expirée. Reconnectez-vous.'); h.Authorization='Bearer '+token;}
  const r=await fetch(SUPABASE_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  const text=await r.text(); let data=null; try{data=text?JSON.parse(text):null}catch{data=text}
  if(!r.ok)throw new Error(data?.message||data?.hint||data?.error||`Erreur ${r.status}`); return data;
}

async function loadSellerData(createIfMissing=false){
  if(!REMOTE)return;
  if(!state.user?.id)throw new Error('Session invalide');
  let shops=await api(`/rest/v1/shops?owner_id=eq.${encodeURIComponent(state.user.id)}&select=*`,{auth:true});
  if(!shops.length && createIfMissing){
    const base=slugify((state.user.name||'ma')+'-boutique');
    let created=null;
    for(let i=0;i<4&&!created;i++){
      const slug=i?`${base}-${Math.floor(1000+Math.random()*9000)}`:base;
      try{created=await api('/rest/v1/shops?select=*',{method:'POST',auth:true,headers:{Prefer:'return=representation'},body:{owner_id:state.user.id,name:'Ma Boutique',slug,description:'Bienvenue dans ma boutique ShopLink Maroc',emoji:'🛍️',category:'Autre',city:'',phone:'',is_open:true}})}catch(e){if(!/duplicate/i.test(String(e.message)))throw e;}
    }
    shops=created||[];
  }
  if(shops[0])state.shop=normalizeShop(shops[0]);
  if(state.shop?.id){
    state.products=(await api(`/rest/v1/products?shop_id=eq.${state.shop.id}&select=*&order=created_at.desc`,{auth:true})).map(normalizeProduct);
    state.orders=(await api('/rest/v1/rpc/get_seller_orders',{method:'POST',auth:true,body:{}})).map(normalizeOrder);
  } else {state.products=[];state.orders=[];}
}

function dashboard(){
  if(!state.user)return go('login');
  app.innerHTML=`<div class="dashboard"><div class="dashTop">${brand()}<div class="dashUser"><span>${esc(state.user.name||'Vendeur')}</span><button class="btn ghost" onclick="go('home')">Accueil</button><button class="btn ghost" onclick="logout()">Déconnexion</button></div></div><div class="dashShell"><aside class="sidebar"><button class="sideBtn active" data-tab="overview" onclick="dashTab('overview',this)">📊 Tableau de bord</button><button class="sideBtn" data-tab="shop" onclick="dashTab('shop',this)">🏪 Ma boutique</button><button class="sideBtn" data-tab="products" onclick="dashTab('products',this)">📦 Produits</button><button class="sideBtn" data-tab="orders" onclick="dashTab('orders',this)">🧾 Commandes</button><button class="sideBtn" onclick="openMyStore()">🔗 Voir ma boutique</button></aside><main class="main" id="dashMain"></main></div><div class="mobileDashNav"><button onclick="go('home')">🏠</button><button onclick="dashTab('overview')">📊</button><button onclick="dashTab('shop')">🏪</button><button onclick="dashTab('products')">📦</button><button onclick="dashTab('orders')">🧾</button></div></div>`;
  dashTab('overview');
}

function dashTab(tab,btn){
  document.querySelectorAll('.sideBtn').forEach(x=>x.classList.remove('active')); if(btn)btn.classList.add('active'); else document.querySelector(`.sideBtn[data-tab="${tab}"]`)?.classList.add('active');
  const m=$('#dashMain'); if(!m)return;
  if(tab==='overview'){
    m.innerHTML=`<div class="topRow"><div><h1>Tableau de bord</h1><div class="sub">Bienvenue ${esc(state.user.name||'Vendeur')}</div></div><button class="btn primary" onclick="openProductModal()">+ Ajouter un produit</button></div><div class="stats"><div class="stat"><b>${state.orders.length}</b><span>Commandes</span></div><div class="stat"><b>${money(sumSales())}</b><span>Ventes</span></div><div class="stat"><b>${state.products.length}</b><span>Produits</span></div><div class="stat"><b>${new Set(state.orders.map(o=>o.phone)).size}</b><span>Clients</span></div></div><div class="panel"><div class="panelHead"><h3>Votre lien boutique</h3><button class="btn soft" onclick="copyShopLink()">Copier le lien</button></div><div class="linkBox">${esc(shopUrl(state.shop.slug))}</div></div><div class="panel"><h3>Dernières commandes</h3>${ordersTable(5)}</div>`;
  } else if(tab==='shop'){
    m.innerHTML=`<div class="topRow"><div><h1>Ma boutique</h1><div class="sub">Personnalisez votre page publique</div></div><button id="saveShopBtn" class="btn primary" onclick="saveShop()">Enregistrer</button></div><div class="panel formGrid"><div class="field"><label>Nom de la boutique</label><input id="shopName" value="${attr(state.shop.name)}"></div><div class="field"><label>Lien unique</label><div class="slugInput"><span>shoplink-maroc.vercel.app/store/</span><input id="shopSlug" value="${attr(state.shop.slug)}"></div></div><div class="field"><label>Catégorie</label><select id="shopCategory">${categories.map(c=>`<option ${c===state.shop.category?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Ville</label><input id="shopCity" value="${attr(state.shop.city||'')}" placeholder="Ex: Rabat"></div><div class="field"><label>Téléphone / WhatsApp</label><input id="shopPhone" value="${attr(state.shop.phone||'')}" placeholder="06XXXXXXXX"></div><div class="field"><label>Emoji / icône</label><input id="shopEmoji" value="${attr(state.shop.emoji||'🛍️')}"></div><div class="field fullSpan"><label>Description</label><textarea id="shopDesc" rows="4">${esc(state.shop.description||'')}</textarea></div><div class="switchRow fullSpan"><label class="toggle"><input id="shopOpen" type="checkbox" ${state.shop.is_open?'checked':''}><span></span></label><div><b>Boutique ouverte</b><div class="sub">Désactivez-la temporairement quand vous ne prenez pas de commandes.</div></div></div></div>`;
  } else if(tab==='products'){
    m.innerHTML=`<div class="topRow"><div><h1>Produits & services</h1><div class="sub">Gérez votre catalogue</div></div><button class="btn primary" onclick="openProductModal()">+ Ajouter</button></div><div class="panel">${productsTable()}</div>`;
  } else {
    m.innerHTML=`<div class="topRow"><div><h1>Commandes</h1><div class="sub">Suivez les commandes clients</div></div></div><div class="panel">${ordersTable()}</div>`;
  }
}

function productsTable(){
  if(!state.products.length)return `<div class="empty">Aucun produit pour le moment.<br><br><button class="btn primary" onclick="openProductModal()">Ajouter votre premier produit</button></div>`;
  return `<div class="tableWrap"><table class="table"><thead><tr><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>Statut</th><th></th></tr></thead><tbody>${state.products.map(p=>`<tr><td><div class="tableProduct">${p.image_url?`<img src="${attr(p.image_url)}" alt="">`:`<span>${esc(p.emoji||'📦')}</span>`}<div><b>${esc(p.name)}</b><small>${esc(p.description||'')}</small></div></div></td><td>${esc(p.category||'Autre')}</td><td>${money(p.price)}</td><td>${p.stock===null||p.stock===''?'—':Number(p.stock)}</td><td><span class="pill ${p.is_active?'':'off'}">${p.is_active?'Actif':'Masqué'}</span></td><td><div class="rowBtns"><button class="iconBtn" title="Modifier" onclick="openProductModal('${p.id}')">✏️</button><button class="iconBtn danger" title="Supprimer" onclick="deleteProduct('${p.id}')">🗑️</button></div></td></tr>`).join('')}</tbody></table></div>`;
}


function ordersTable(limit){
  const arr=limit?state.orders.slice(0,limit):state.orders;
  if(!arr.length)return `<div class="empty">Aucune commande pour le moment.</div>`;
  return `<div class="tableWrap"><table class="table"><thead><tr><th>Client</th><th>Total</th><th>Articles</th><th>Date</th><th>Statut</th></tr></thead><tbody>${arr.map(o=>`<tr><td><b>${esc(o.customer_name||o.name)}</b><br><span class="sub">${esc(o.phone)}</span>${o.address?`<br><span class="sub">${esc(o.address)}</span>`:''}</td><td>${money(o.total)}</td><td>${Array.isArray(o.items)?o.items.reduce((s,x)=>s+Number(x.qty||1),0):0}</td><td>${formatDate(o.created_at||o.createdAt)}</td><td><select class="statusSelect" onchange="updateOrderStatus('${o.id}',this.value)">${Object.entries(statusLabels).map(([v,l])=>`<option value="${v}" ${o.status===v?'selected':''}>${l}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`;
}

function openProductModal(id=''){
  const p=state.products.find(x=>String(x.id)===String(id))||{name:'',price:'',description:'',category:'Autre',stock:'',emoji:'📦',image_url:'',is_active:true};
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalBox"><div class="panelHead"><h2>${id?'Modifier':'Ajouter'} un produit</h2><button class="modalX" onclick="$('#modal').remove()">×</button></div><div class="imagePicker"><div id="imagePreview" class="imagePreview">${p.image_url?`<img src="${attr(p.image_url)}" alt="">`:`<span>${esc(p.emoji||'📦')}</span>`}</div><div><label class="btn soft fileBtn">📷 Choisir une photo<input id="pImage" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewImage(this)"></label><div class="sub">JPG, PNG ou WebP • max 5 MB</div></div></div><div class="twoCols"><div class="field"><label>Nom</label><input id="pName" value="${attr(p.name)}" placeholder="Ex: T-shirt noir"></div><div class="field"><label>Prix (DH)</label><input id="pPrice" value="${attr(p.price)}" type="number" min="0" step="0.01" placeholder="99"></div><div class="field"><label>Catégorie</label><select id="pCategory">${categories.map(c=>`<option ${c===p.category?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Stock (optionnel)</label><input id="pStock" value="${p.stock??''}" type="number" min="0" placeholder="10"></div><div class="field"><label>Emoji si pas de photo</label><input id="pEmoji" value="${attr(p.emoji||'📦')}"></div><div class="field checkboxField"><label><input id="pActive" type="checkbox" ${p.is_active!==false?'checked':''}> Produit visible</label></div></div><div class="field"><label>Description</label><textarea id="pDesc" rows="3" placeholder="Description courte">${esc(p.description||'')}</textarea></div><div class="modalActions"><button class="btn soft" onclick="$('#modal').remove()">Annuler</button><button id="productSaveBtn" class="btn primary" onclick="saveProduct('${id}')">${id?'Enregistrer':'Ajouter'}</button></div></div></div>`);
}

function previewImage(input){const f=input.files?.[0]; if(!f)return; if(f.size>5*1024*1024){input.value='';return toast('Photo trop lourde: 5 MB maximum.');}const url=URL.createObjectURL(f);$('#imagePreview').innerHTML=`<img src="${url}" alt="Aperçu">`;}

async function saveProduct(id=''){
  const name=$('#pName').value.trim(),price=Number($('#pPrice').value),desc=$('#pDesc').value.trim(),emoji=$('#pEmoji').value||'📦',category=$('#pCategory').value,stockRaw=$('#pStock').value,is_active=$('#pActive').checked;
  if(!name||Number.isNaN(price)||price<0)return toast('Ajoutez un nom et un prix valide.');
  const existing=state.products.find(x=>String(x.id)===String(id));
  let image_url=existing?.image_url||'';
  const file=$('#pImage')?.files?.[0];
  setBusy('#productSaveBtn',true,'Enregistrement...');
  try{
    if(file){image_url=REMOTE?await uploadImage(file):await imageToDataUrl(file);}
    const payload={name,price,description:desc,emoji,category,stock:stockRaw===''?null:Number(stockRaw),image_url:image_url||null,is_active};
    if(REMOTE){
      if(id){const rows=await api(`/rest/v1/products?id=eq.${encodeURIComponent(id)}&select=*`,{method:'PATCH',auth:true,headers:{Prefer:'return=representation'},body:payload}); const i=state.products.findIndex(x=>x.id===id); if(i>=0)state.products[i]=normalizeProduct(rows[0]);}
      else {const rows=await api('/rest/v1/products?select=*',{method:'POST',auth:true,headers:{Prefer:'return=representation'},body:{...payload,shop_id:state.shop.id}}); state.products.unshift(normalizeProduct(rows[0]));}
    }else{
      if(id){const i=state.products.findIndex(x=>String(x.id)===String(id)); state.products[i]={...state.products[i],...payload};}
      else state.products.unshift({id:crypto.randomUUID(),shop_id:'local-shop',created_at:new Date().toISOString(),...payload});
      DB.set('sl_products',state.products);
    }
    $('#modal')?.remove();dashTab('products');toast(id?'Produit modifié ✅':'Produit ajouté ✅');
  }catch(e){toast(friendlyError(e));}
  finally{setBusy('#productSaveBtn',false,id?'Enregistrer':'Ajouter');}
}

async function deleteProduct(id){
  if(!confirm('Supprimer ce produit ?'))return;
  try{if(REMOTE)await api(`/rest/v1/products?id=eq.${encodeURIComponent(id)}`,{method:'DELETE',auth:true});state.products=state.products.filter(x=>String(x.id)!==String(id));if(!REMOTE)DB.set('sl_products',state.products);dashTab('products');toast('Produit supprimé.');}catch(e){toast(friendlyError(e));}
}

async function saveShop(){
  const payload={name:$('#shopName').value.trim()||'Ma Boutique',slug:slugify($('#shopSlug').value),description:$('#shopDesc').value.trim(),emoji:$('#shopEmoji').value||'🛍️',category:$('#shopCategory').value,city:$('#shopCity').value.trim(),phone:$('#shopPhone').value.trim(),is_open:$('#shopOpen').checked};
  if(payload.slug.length<3)return toast('Le lien doit contenir au moins 3 caractères.');
  setBusy('#saveShopBtn',true,'Enregistrement...');
  try{
    if(REMOTE){const rows=await api(`/rest/v1/shops?id=eq.${state.shop.id}&select=*`,{method:'PATCH',auth:true,headers:{Prefer:'return=representation'},body:payload});state.shop=normalizeShop(rows[0]);}
    else{state.shop={...state.shop,...payload};DB.set('sl_shop',state.shop);}
    toast('Boutique enregistrée ✅');
  }catch(e){toast(friendlyError(e));}
  finally{setBusy('#saveShopBtn',false,'Enregistrer');}
}

async function updateOrderStatus(id,status){
  try{
    if(REMOTE){await api('/rest/v1/rpc/seller_update_order_status',{method:'POST',auth:true,body:{p_order_id:id,p_status:status}});}
    const o=state.orders.find(x=>String(x.id)===String(id));if(o)o.status=status;if(!REMOTE)DB.set('sl_orders',state.orders);toast('Statut mis à jour ✅');
  }catch(e){toast(friendlyError(e));}
}


async function uploadImage(file){
  const token=await validToken(); if(!token)throw new Error('Session expirée.');
  const ext=(file.type.split('/')[1]||'jpg').replace('jpeg','jpg'); const path=`${state.user.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const r=await fetch(`${SUPABASE_URL}/storage/v1/object/product-images/${path}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':file.type,'x-upsert':'false'},body:file});
  if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.message||'Échec de la photo');}
  return `${SUPABASE_URL}/storage/v1/object/public/product-images/${path}`;
}
function imageToDataUrl(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.78));};img.onerror=reject;img.src=url;});}

async function openMyStore(){location.href=shopUrl(state.shop.slug);}
function shopUrl(slug){return `${location.origin}/store/${encodeURIComponent(slug||'ma-boutique')}`;}
async function copyShopLink(){try{await navigator.clipboard.writeText(shopUrl(state.shop.slug));toast('Lien copié ✅');}catch{prompt('Copiez votre lien:',shopUrl(state.shop.slug));}}

function openDemo(){state.publicShop={id:'demo',name:'Ma Boutique',slug:'demo',description:'Une boutique ShopLink peut vendre des produits ou services de toute catégorie.',emoji:'🛍️',category:'Autre',city:'Maroc',phone:'',is_open:true};state.publicProducts=[{id:'d1',name:'Article tendance',price:199,description:'Exemple de produit personnalisable.',emoji:'👕',category:'Mode',is_active:true},{id:'d2',name:'Accessoire',price:149,description:'Ajoutez vos propres images et informations.',emoji:'🎧',category:'Électronique',is_active:true},{id:'d3',name:'Création locale',price:89,description:'ShopLink convient à tous les types de commerces.',emoji:'🎁',category:'Artisanat',is_active:true}];renderStore();}

async function publicStore(slug){
  showLoader('Chargement de la boutique...');
  try{
    if(REMOTE){
      const shops=await api(`/rest/v1/shops?slug=eq.${encodeURIComponent(slug)}&select=id,name,slug,description,emoji,category,city,phone,is_open&limit=1`); if(!shops.length)return notFoundStore();
      state.publicShop=normalizeShop(shops[0]);state.publicProducts=(await api(`/rest/v1/products?shop_id=eq.${state.publicShop.id}&is_active=eq.true&select=id,name,description,category,price,stock,emoji,image_url,is_active&order=created_at.desc`)).map(normalizeProduct);
    } else {
      if(slug===state.shop.slug){state.publicShop={...state.shop,id:state.shop.id||'local-shop'};state.publicProducts=state.products.filter(p=>p.is_active!==false);} else return notFoundStore();
    }
    renderStore();
  }catch(e){app.innerHTML=`<div class="centerError">${brand()}<h2>Impossible de charger la boutique</h2><p>${esc(friendlyError(e))}</p><button class="btn primary" onclick="go('home')">Accueil</button></div>`;}
}

function renderStore(){
  const s=state.publicShop,p=state.publicProducts||[];state.cart=[];
  app.innerHTML=`<div class="storePage"><div class="storeNav"><div class="container">${brand()}<div class="storeNavActions"><button class="btn soft" onclick="shareCurrentShop()">Partager</button>${state.user?`<button class="btn soft" onclick="go('dashboard')">Dashboard</button>`:`<button class="btn soft" onclick="go('home')">Accueil</button>`}</div></div></div><header class="shopHeader"><div class="container shopHeadInner"><div class="avatar">${esc(s.emoji||'🛍️')}</div><div><span class="pill ${s.is_open?'':'off'}">${s.is_open?'Ouvert':'Fermé'}</span><h1>${esc(s.name)}</h1><div class="shopMeta">${s.category?`<span>${esc(s.category)}</span>`:''}${s.city?`<span>📍 ${esc(s.city)}</span>`:''}</div><div class="shopDescription">${esc(s.description||'')}</div></div></div></header><main class="catalog"><div class="container"><div class="topRow"><div><h2>Catalogue</h2><div class="sub">${p.length} ${p.length===1?'article':'articles'}</div></div>${p.length?`<select id="catalogFilter" class="catalogFilter" onchange="filterCatalog(this.value)"><option value="">Toutes les catégories</option>${[...new Set(p.map(x=>x.category).filter(Boolean))].map(c=>`<option>${esc(c)}</option>`).join('')}</select>`:''}</div><div id="catalogGrid" class="catalogGrid">${catalogCards(p)}</div>${!p.length?`<div class="emptyStore">Cette boutique n'a pas encore ajouté de produits.</div>`:''}</div></main><div id="cartHolder"></div></div>`;renderCart();
}

function catalogCards(products){return products.map(p=>`<article class="catalogCard" data-cat="${attr(p.category||'')}">${p.image_url?`<div class="catalogImg photo"><img src="${attr(p.image_url)}" alt="${attr(p.name)}"></div>`:`<div class="catalogImg">${esc(p.emoji||'📦')}</div>`}<div class="catalogBody"><div class="catalogCategory">${esc(p.category||'')}</div><h3>${esc(p.name)}</h3><p>${esc(p.description||'Produit disponible')}</p><div class="catalogBottom"><div><b class="price">${money(p.price)}</b>${p.stock!==null&&p.stock!==undefined?`<small class="stock">${Number(p.stock)>0?`${Number(p.stock)} en stock`:'Rupture'}</small>`:''}</div><button class="btn primary" ${!state.publicShop.is_open||(p.stock!==null&&Number(p.stock)<=0)?'disabled':''} onclick="addCartById('${p.id}')">Ajouter</button></div></div></article>`).join('')}
function filterCatalog(cat){document.querySelectorAll('.catalogCard').forEach(el=>el.style.display=!cat||el.dataset.cat===cat?'':'none');}
function addCartById(id){
  const p=state.publicProducts.find(x=>String(x.id)===String(id));if(!p)return;
  const line=state.cart.find(x=>String(x.id)===String(id));
  const next=(line?.qty||0)+1;
  if(p.stock!==null&&p.stock!==undefined&&next>Number(p.stock))return toast('Stock maximum atteint.');
  if(line)line.qty=next;else state.cart.push({...p,qty:1});
  renderCart();toast('Ajouté au panier ✅');
}
function changeCartQty(id,delta){
  const line=state.cart.find(x=>String(x.id)===String(id));if(!line)return;
  const next=Number(line.qty||1)+Number(delta||0);
  if(next<=0){state.cart=state.cart.filter(x=>String(x.id)!==String(id));}
  else {if(line.stock!==null&&line.stock!==undefined&&next>Number(line.stock))return toast('Stock maximum atteint.');line.qty=next;}
  renderCart();
  const box=$('#checkoutCartLines');if(box)box.innerHTML=cartLinesHtml();
  if(!state.cart.length)$('#modal')?.remove();
}
function cartCount(){return state.cart.reduce((s,p)=>s+Number(p.qty||1),0)}
function cartTotal(){return state.cart.reduce((s,p)=>s+Number(p.price)*Number(p.qty||1),0)}
function renderCart(){const h=$('#cartHolder');if(!h)return;if(!state.cart.length){h.innerHTML='';return}h.innerHTML=`<div class="cartBar" onclick="checkout()"><span>🛒 Panier (${cartCount()})</span><b>${money(cartTotal())} →</b></div>`}

function cartLinesHtml(){return `${state.cart.map(p=>`<div class="cartLine"><div><b>${esc(p.name)}</b><small>${money(p.price)} / unité</small></div><div class="qtyControl"><button type="button" onclick="changeCartQty('${p.id}',-1)">−</button><span>${p.qty}</span><button type="button" onclick="changeCartQty('${p.id}',1)">+</button></div><b>${money(Number(p.price)*p.qty)}</b></div>`).join('')}<div class="cartTotal"><span>Total</span><b>${money(cartTotal())}</b></div>`}

function checkout(){
  if(!state.publicShop?.is_open)return toast('Cette boutique est fermée actuellement.');
  if(!state.cart.length)return toast('Votre panier est vide.');
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalBox"><div class="panelHead"><h2>Finaliser la commande</h2><button class="modalX" onclick="$('#modal').remove()">×</button></div><div class="cartLines" id="checkoutCartLines">${cartLinesHtml()}</div><div class="twoCols"><div class="field"><label>Votre nom</label><input id="cName" autocomplete="name" placeholder="Nom complet"></div><div class="field"><label>Téléphone</label><input id="cPhone" inputmode="tel" autocomplete="tel" placeholder="06XXXXXXXX"></div></div><div class="field"><label>Adresse / ville</label><input id="cAddress" autocomplete="street-address" placeholder="Adresse ou lieu de livraison"></div><div class="field"><label>Note (optionnel)</label><textarea id="cNote" rows="3" placeholder="Taille, couleur, détails..."></textarea></div><div class="modalActions"><button class="btn soft" onclick="$('#modal').remove()">Annuler</button><button id="orderBtn" class="btn primary" onclick="placeOrder()">Confirmer la commande</button></div></div></div>`);
}

async function placeOrder(){
  const name=$('#cName').value.trim(),phone=$('#cPhone').value.trim(),address=$('#cAddress').value.trim(),note=$('#cNote').value.trim();if(name.length<2||phone.length<8)return toast('Ajoutez votre nom et téléphone.');
  const order={shop_id:state.publicShop.id,customer_name:name,phone,address,note,total:cartTotal(),status:'new',items:state.cart.map(p=>({product_id:p.id,name:p.name,qty:p.qty,price:Number(p.price)}))};
  setBusy('#orderBtn',true,'Envoi...');
  try{
    if(REMOTE){throw new Error('secure_order_flow_required');}
    else if(state.publicShop.slug===state.shop.slug){const local={id:crypto.randomUUID(),...order,created_at:new Date().toISOString()};state.orders.unshift(local);DB.set('sl_orders',state.orders);}
    state.cart=[];$('#modal')?.remove();renderCart();orderSuccess(name);
  }catch(e){toast(friendlyError(e));setBusy('#orderBtn',false,'Confirmer la commande');}
}
function orderSuccess(name){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modalBox successBox"><div class="successIcon">✓</div><h2>Commande envoyée !</h2><p>Merci ${esc(name)}. La boutique a bien reçu votre commande.</p><button class="btn primary full" onclick="$('#modal').remove()">Continuer</button></div></div>`);}
async function shareCurrentShop(){const url=location.href;try{if(navigator.share)await navigator.share({title:state.publicShop?.name||'ShopLink Maroc',url});else{await navigator.clipboard.writeText(url);toast('Lien copié ✅');}}catch{}}

function notFoundStore(){app.innerHTML=`<div class="centerError">${brand()}<h2>Boutique introuvable</h2><p>Ce lien n'existe pas ou la boutique a été supprimée.</p><button class="btn primary" onclick="location.href='/'">Retour à ShopLink Maroc</button></div>`}
function showLoader(t='Chargement...'){app.innerHTML=`<div class="loaderPage">${brand()}<div class="spinner"></div><p>${esc(t)}</p></div>`}

async function logout(){
  if(REMOTE&&state.session){try{const token=await validToken();if(token)await fetch(`${SUPABASE_URL}/auth/v1/logout`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token}});}catch{}}
  state.session=null;state.user=null;state.shop={...defaults.shop};state.products=[];state.orders=[];DB.set('sl_session',null);DB.set('sl_user',null);go('home');

function slxOrderStats(){

  const avg=active.length?active.reduce((s,o)=>s+Number(o.total||0),0)/active.length:0;

  const low=state.products.filter(p=>p.is_active!==false&&p.stock!==null&&p.stock!==undefined&&Number(p.stock)<=3).length;
  return {monthSales:month.reduce((s,o)=>s+Number(o.total||0),0),monthOrders:month.length,avg,fresh,low};
}

function slxUseLocation(){

(function(){

})();

</style>
<script id="sl41-script">
(function(){
  const BUILD='v47-secure-fallbacks';
  const sl41={isAdmin:false,admin:null,adminContacts:null,publicShops:[],lastAdminLoad:0};
  window.SL41=sl41;
  try{document.querySelector('meta[name="shoplink-build"]')?.setAttribute('content',BUILD);document.querySelector('meta[name="robots"]')?.setAttribute('content','index,follow,max-image-preview:large')}catch{}

  const themeDefaults={primary_color:'#16a34a',secondary_color:'#fbbf24',background_color:'#f6f7f6',surface_color:'#ffffff',text_color:'#111111',header_color:'#10291a',button_text_color:'#ffffff'};
  function validHex(v){return /^#[0-9a-f]{6}$/i.test(String(v||''))}
  function sl41Theme(s){const x={...themeDefaults,...(s||{})};Object.keys(themeDefaults).forEach(k=>{if(!validHex(x[k]))x[k]=themeDefaults[k]});return x}
  function sl41Digits(v=''){return String(v).replace(/\D/g,'')}
  function sl41PhoneOk(v=''){let d=sl41Digits(v);if(d.startsWith('00'))d=d.slice(2);return /^0[67]\d{8}$/.test(d)||/^212[67]\d{8}$/.test(d)}
  function sl41Template(){try{return JSON.parse(localStorage.getItem('sl41_template')||'null')}catch{return null}}
  function sl41TemplateDefaults(){const t=sl41Template()?.value||'Products';if(t==='Restaurant')return {category:'Restauration',emoji:'🍽️'};if(t==='Fashion')return {category:'Mode',emoji:'👕'};return {category:'Autre',emoji:'🛍️'}}
  function sl41OrderRef(o){return o.order_number||String(o.id||'').replace(/-/g,'').slice(0,8).toUpperCase()}

  const SL41_friendlyError=window.friendlyError;
  window.friendlyError=function(e){const m=String(e?.message||e||'Erreur');
    if(/invalid_phone/i.test(m))return 'Numéro marocain invalide. Utilisez 06XXXXXXXX ou 07XXXXXXXX.';
    if(/invalid_city/i.test(m))return 'Ajoutez votre ville.';
    if(/invalid_address/i.test(m))return 'Ajoutez une adresse de livraison.';
    if(/shop_closed_or_missing/i.test(m))return 'Cette boutique est fermée ou indisponible.';
    if(/duplicate_order_too_fast/i.test(m))return 'Cette commande vient déjà d’être envoyée. Attendez quelques secondes.';
    if(/rate_limit_exceeded/i.test(m))return 'Trop de commandes envoyées en peu de temps. Réessayez plus tard.';
    if(/product_missing_or_inactive/i.test(m))return 'Un produit n’est plus disponible.';
    if(/insufficient_stock/i.test(m))return 'Stock insuffisant pour un des produits.';
    if(/forbidden/i.test(m))return 'Accès non autorisé.';
    if(/contact_locked/i.test(m))return 'Le contact est encore verrouillé.';
    return typeof SL41_friendlyError==='function'?SL41_friendlyError(e):m;
  };

  const SL41_normalizeShop=window.normalizeShop;
  window.normalizeShop=function(s){return {...(SL41_normalizeShop?SL41_normalizeShop(s):s),...sl41Theme(s),logo_url:s?.logo_url||null,contact_email:s?.contact_email||'',opening_hours:s?.opening_hours||{},contacts_unlocked_count:Number(s?.contacts_unlocked_count??0)}};
  const SL41_normalizeOrder=window.normalizeOrder;
  window.normalizeOrder=function(o){const x=SL41_normalizeOrder?SL41_normalizeOrder(o):o;return {...x,contact_unlocked:o?.contact_unlocked===true,unlock_price:Number(o?.unlock_price??5),payment_status:o?.payment_status||'locked',order_number:o?.order_number||sl41OrderRef(o),delivery_method:o?.delivery_method||''}};

  async function sl41IsAdmin(){
    if(!REMOTE||!state.user)return false;
    try{const r=await api('/rest/v1/rpc/is_platform_admin',{method:'POST',auth:true,body:{}});sl41.isAdmin=r===true;return sl41.isAdmin}catch{sl41.isAdmin=false;return false}
  }
  window.sl41IsAdmin=sl41IsAdmin;

  window.loadSellerData=async function(createIfMissing=false){
    if(!REMOTE)return;
    if(!state.user?.id)throw new Error('Session invalide');
    let shops=await api(`/rest/v1/shops?owner_id=eq.${encodeURIComponent(state.user.id)}&select=*`,{auth:true});
    if(!shops.length&&createIfMissing){
      const td=sl41TemplateDefaults(),base=slugify((state.user.name||'ma')+'-boutique');let created=null;
      for(let i=0;i<4&&!created;i++){
        const slug=i?`${base}-${Math.floor(1000+Math.random()*9000)}`:base;
        try{created=await api('/rest/v1/shops?select=*',{method:'POST',auth:true,headers:{Prefer:'return=representation'},body:{owner_id:state.user.id,name:'Ma Boutique',slug,description:'Bienvenue dans ma boutique ShopLink Maroc',emoji:td.emoji,category:td.category,city:'',phone:'',is_open:true}})}catch(e){if(!/duplicate/i.test(String(e.message)))throw e}
      }
      shops=created||[];try{localStorage.removeItem('sl41_template')}catch{}
    }
    if(shops[0])state.shop=normalizeShop(shops[0]);
    if(state.shop?.id){
      state.products=(await api(`/rest/v1/products?shop_id=eq.${state.shop.id}&select=*&order=created_at.desc`,{auth:true})).map(normalizeProduct);
      const orders=await api('/rest/v1/rpc/get_seller_orders',{method:'POST',auth:true,body:{}});
      state.orders=(Array.isArray(orders)?orders:[]).map(normalizeOrder);
    }else{state.products=[];state.orders=[]}
    await sl41IsAdmin();
  };

  const SL41_dashboard=window.dashboard;
  function sl41AdminNav(){
    if(!sl41.isAdmin)return;
    const side=document.querySelector('.sidebar');
    if(side&&!side.querySelector('[data-tab="admin"]')){const b=document.createElement('button');b.className='sideBtn';b.dataset.tab='admin';b.innerHTML='🛡️ Administration';b.onclick=function(){dashTab('admin',this)};side.appendChild(b)}
    const mob=document.querySelector('.mobileDashNav');
    if(mob&&!mob.querySelector('[data-tab="admin"]')){const b=document.createElement('button');b.dataset.tab='admin';b.textContent='🛡️';b.title='Administration';b.onclick=()=>dashTab('admin');mob.appendChild(b)}
  }
  window.dashboard=function(){SL41_dashboard();sl41AdminNav();if(state.user&&!sl41.isAdmin)sl41IsAdmin().then(ok=>{if(ok)sl41AdminNav()})};

  function sl41ThemePanel(){const t=sl41Theme(state.shop),logo=state.shop.logo_url?`<img src="${attr(state.shop.logo_url)}" alt="Logo">`:esc(state.shop.emoji||'🛍️');return `
    <div class="panel" id="sl41ThemePanel"><div class="panelHead"><div><h3>Logo & couleurs</h3><div class="sub">Chaque vendeur peut personnaliser sa boutique sans changer ShopLink.</div></div><button class="btn soft" type="button" onclick="sl41ResetTheme()">Couleurs par défaut</button></div>
      <div class="sl41-logo-row"><div class="sl41-logo-preview" id="sl41LogoPreview">${logo}</div><div><label class="btn soft fileBtn">📷 Changer le logo<input id="sl41LogoFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="sl41PreviewLogo(this)"></label><div class="sub" style="margin-top:7px">JPG, PNG ou WebP • max 5 MB</div></div></div>
      <div class="sl41-colors" style="margin-top:18px">
        ${sl41ColorField('Couleur principale','primary_color',t.primary_color)}
        ${sl41ColorField('Couleur secondaire','secondary_color',t.secondary_color)}
        ${sl41ColorField('Fond boutique','background_color',t.background_color)}
        ${sl41ColorField('Cartes / surface','surface_color',t.surface_color)}
        ${sl41ColorField('Texte','text_color',t.text_color)}
        ${sl41ColorField('En-tête','header_color',t.header_color)}
        ${sl41ColorField('Texte boutons','button_text_color',t.button_text_color)}
      </div>
      <div id="sl41ThemePreview" class="sl41-theme-preview" style="margin-top:18px;--sl-bg:${t.background_color};--sl-surface:${t.surface_color};--sl-text:${t.text_color};--sl-header:${t.header_color};--sl-primary:${t.primary_color};--sl-btntext:${t.button_text_color}"><div class="head">Aperçu de l’en-tête</div><div class="card"><b>Exemple de produit</b><div>49 DH</div><span class="cta">Ajouter</span></div></div>
    </div>`}
  function sl41ColorField(label,key,value){return `<label class="sl41-color"><input type="color" id="sl41_${key}" value="${attr(value)}" oninput="sl41SyncColor('${key}',this.value)"><span><small>${esc(label)}</small><input type="text" id="sl41_${key}_text" value="${attr(value)}" maxlength="7" oninput="sl41SyncColorText('${key}',this.value)"></span></label>`}
  window.sl41SyncColor=function(key,value){const t=document.querySelector(`#sl41_${key}_text`);if(t)t.value=value;sl41UpdatePreview()};
  window.sl41SyncColorText=function(key,value){if(validHex(value)){const c=document.querySelector(`#sl41_${key}`);if(c)c.value=value;sl41UpdatePreview()}};
  window.sl41UpdatePreview=function(){const p=document.querySelector('#sl41ThemePreview');if(!p)return;const map={primary_color:'--sl-primary',background_color:'--sl-bg',surface_color:'--sl-surface',text_color:'--sl-text',header_color:'--sl-header',button_text_color:'--sl-btntext'};Object.entries(map).forEach(([k,v])=>{const x=document.querySelector(`#sl41_${k}`)?.value;if(x)p.style.setProperty(v,x)})};
  window.sl41ResetTheme=function(){Object.entries(themeDefaults).forEach(([k,v])=>{const c=document.querySelector(`#sl41_${k}`),t=document.querySelector(`#sl41_${k}_text`);if(c)c.value=v;if(t)t.value=v});sl41UpdatePreview()};
  window.sl41PreviewLogo=function(input){const f=input?.files?.[0];if(!f)return;if(f.size>5*1024*1024){input.value='';return toast('Logo trop lourd : maximum 5 MB.')}const u=URL.createObjectURL(f),p=document.querySelector('#sl41LogoPreview');if(p)p.innerHTML=`<img src="${u}" alt="Aperçu logo">`};
  async function sl41UploadLogo(file){const token=await validToken();if(!token)throw new Error('Session expirée.');const ext=(file.type.split('/')[1]||'jpg').replace('jpeg','jpg'),path=`${state.user.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const r=await fetch(`${SUPABASE_URL}/storage/v1/object/shop-logos/${path}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':file.type,'x-upsert':'false'},body:file});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.message||'Échec du logo');}return `${SUPABASE_URL}/storage/v1/object/public/shop-logos/${path}`;}

  const SL41_dashTab=window.dashTab;
  window.dashTab=function(tab,btn){
    if(tab==='admin'){document.querySelectorAll('.sideBtn').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');else document.querySelector('[data-tab="admin"]')?.classList.add('active');return sl41RenderAdmin()}
    SL41_dashTab(tab,btn);
    if(tab==='shop'){
      const m=document.querySelector('#dashMain');if(m&&!m.querySelector('#sl41ThemePanel'))m.insertAdjacentHTML('beforeend',sl41ThemePanel());
      const prefix=m?.querySelector('.slugInput span');if(prefix)prefix.textContent='shoplink-maroc.vercel.app/store/';
    }
    if(tab==='orders'){
      const m=document.querySelector('#dashMain'),panel=m?.querySelector('.panel');
      if(panel&&!panel.querySelector('.sl41-unlock-note'))panel.insertAdjacentHTML('afterbegin',`<div class="sl41-unlock-note"><div><b>Contacts clients protégés</b><div class="sub">Déblocage sécurisé : 5 DH/contact.</div></div><span class="sl41-adminBadge">🔒 Numéros masqués</span></div>`)
    }
  };

  window.saveShop=async function(){
    const phone=document.querySelector('#shopPhone')?.value.trim()||'';if(phone&&!sl41PhoneOk(phone))return toast('Numéro WhatsApp invalide.');
    const payload={name:document.querySelector('#shopName')?.value.trim()||'Ma Boutique',slug:slugify(document.querySelector('#shopSlug')?.value||''),description:document.querySelector('#shopDesc')?.value.trim()||'',emoji:document.querySelector('#shopEmoji')?.value||'🛍️',category:document.querySelector('#shopCategory')?.value||'Autre',city:document.querySelector('#shopCity')?.value.trim()||'',phone,is_open:!!document.querySelector('#shopOpen')?.checked,logo_url:state.shop.logo_url||null};
    for(const k of Object.keys(themeDefaults)){const v=document.querySelector(`#sl41_${k}`)?.value||state.shop[k]||themeDefaults[k];payload[k]=validHex(v)?v:themeDefaults[k]}
    if(payload.slug.length<3)return toast('Le lien doit contenir au moins 3 caractères.');
    const f=document.querySelector('#sl41LogoFile')?.files?.[0];
    setBusy('#saveShopBtn',true,'Enregistrement...');
    try{
      if(f)payload.logo_url=await sl41UploadLogo(f);
      if(REMOTE){const rows=await api(`/rest/v1/shops?id=eq.${state.shop.id}&select=*`,{method:'PATCH',auth:true,headers:{Prefer:'return=representation'},body:payload});state.shop=normalizeShop(rows[0])}
      else{state.shop=normalizeShop({...state.shop,...payload});DB.set('sl_shop',state.shop)}
      toast('Boutique enregistrée ✅');dashTab('shop');
    }catch(e){toast(friendlyError(e))}finally{setBusy('#saveShopBtn',false,'Enregistrer')}
  };

  window.ordersTable=function(limit){
    const arr=limit?state.orders.slice(0,limit):state.orders;if(!arr.length)return `<div class="empty">Aucune commande pour le moment.</div>`;
    return `<div class="tableWrap"><table class="table"><thead><tr><th>Client</th><th>Total</th><th>Articles</th><th>Date</th><th>Statut</th><th>Actions</th></tr></thead><tbody>${arr.map(o=>{
      const cnt=Array.isArray(o.items)?o.items.reduce((s,x)=>s+Number(x.qty||1),0):0,unlocked=o.contact_unlocked===true,phone=esc(o.phone||'••••••••••');
      return `<tr data-order-id="${attr(o.id)}"><td><b>${esc(o.customer_name||o.name||'Client')}</b><span class="sl41-order-ref">#${esc(sl41OrderRef(o))}</span><br><span class="sl41-phone ${unlocked?'sl41-unlocked':'sl41-locked'}">${unlocked?'🔓':'🔒'} ${phone}</span>${o.city?`<br><span class="sub">📍 ${esc(o.city)}</span>`:''}${o.address?`<br><span class="sub">${esc(o.address)}</span>`:''}${o.delivery_method?`<br><span class="sub">🚚 ${esc(o.delivery_method)}</span>`:''}</td><td>${money(o.total)}</td><td>${cnt}</td><td>${formatDate(o.created_at||o.createdAt)}</td><td><select class="statusSelect" onchange="updateOrderStatus('${o.id}',this.value)">${Object.entries(statusLabels).map(([v,l])=>`<option value="${v}" ${o.status===v?'selected':''}>${l}</option>`).join('')}</select></td><td><div class="sl41-order-actions">${unlocked?'':`<button class="btn primary sl41-mini" onclick="sl41UnlockContact('${o.id}')">🔓 Débloquer · 5 DH</button>`}<button class="btn soft sl41-mini" onclick="sl41PrintOrder('${o.id}')">🖨️</button><button class="btn soft sl41-mini" onclick="sl41DeleteOrder('${o.id}')">🗑️</button></div></td></tr>`}).join('')}</tbody></table></div>`
  };

  window.updateOrderStatus=async function(id,status){
    try{if(REMOTE)await api('/rest/v1/rpc/seller_update_order_status',{method:'POST',auth:true,body:{p_order_id:id,p_status:status}});const o=state.orders.find(x=>String(x.id)===String(id));if(o)o.status=status;const tr=document.querySelector(`tr[data-order-id="${CSS.escape(String(id))}"]`)||document.querySelector(`tr[data-oid="${CSS.escape(String(id))}"]`);if(tr)tr.dataset.status=status;if(!REMOTE)DB.set('sl_orders',state.orders);toast('Statut mis à jour ✅')}catch(e){toast(friendlyError(e));await sl41RefreshOrders()}
  };
  window.sl41DeleteOrder=async function(id){if(!confirm('Supprimer cette commande ?'))return;try{if(REMOTE)await api('/rest/v1/rpc/seller_delete_order',{method:'POST',auth:true,body:{p_order_id:id}});state.orders=state.orders.filter(o=>String(o.id)!==String(id));if(!REMOTE)DB.set('sl_orders',state.orders);toast('Commande supprimée ✅');dashTab('orders')}catch(e){toast(friendlyError(e))}};
  window.sl41PrintOrder=function(id){const o=state.orders.find(x=>String(x.id)===String(id));if(!o)return;const items=(o.items||[]).map(i=>`<tr><td>${esc(i.qty)}× ${esc(i.name)}</td><td style="text-align:right">${money(Number(i.price)*Number(i.qty||1))}</td></tr>`).join('');const w=window.open('','_blank','width=520,height=720');if(!w)return toast('Autorisez les fenêtres pop-up pour imprimer.');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Commande #${esc(sl41OrderRef(o))}</title><style>body{font-family:system-ui;padding:24px;color:#111}h1{font-size:20px}table{width:100%;border-collapse:collapse}td{padding:7px 0;border-bottom:1px dashed #bbb}.total{font-size:20px;font-weight:800;text-align:right;margin-top:15px}.muted{color:#666;font-size:12px}</style></head><body><h1>ShopLink Maroc — #${esc(sl41OrderRef(o))}</h1><p><b>${esc(o.customer_name||'Client')}</b><br>${esc(o.phone||'')}<br>${esc(o.city||'')} ${esc(o.address||'')}</p><p class="muted">${esc(o.delivery_method||'')} • ${esc(formatDate(o.created_at))}</p><table>${items}</table><div class="total">${money(o.total)}</div><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()};
  async function sl41RefreshOrders(){if(!REMOTE){dashTab('orders');return}try{const rows=await api('/rest/v1/rpc/get_seller_orders',{method:'POST',auth:true,body:{}});state.orders=(Array.isArray(rows)?rows:[]).map(normalizeOrder);const shops=await api(`/rest/v1/shops?owner_id=eq.${encodeURIComponent(state.user.id)}&select=*`,{auth:true});if(shops[0])state.shop=normalizeShop(shops[0]);dashTab('orders')}catch(e){toast(friendlyError(e))}}
  window.sl41RefreshOrders=sl41RefreshOrders;

  window.render=async function(){const path=location.pathname.replace(/\/+$/,'')||'/';if(/^\/store\//i.test(path)){const slug=decodeURIComponent(path.split('/').filter(Boolean).slice(1).join('/'));return publicStore(slug)}if(path==='/create-store'){if(state.user)return dashboard();auth('signup');sl41InjectTemplate();return}const r=location.hash.slice(1);if(r==='explore')return sl41Explore();return SL41_render()};
  window.addEventListener('popstate',()=>window.render());


  window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(r==='features'||r==='how')setTimeout(()=>document.getElementById(r)?.scrollIntoView({behavior:'smooth',block:'start'}),0)});

  // Refresh the first screen after the final overrides are installed.
  setTimeout(async()=>{try{if(REMOTE&&state.user){await loadSellerData(false)}await window.render()}catch(e){console.error('ShopLink v47 boot',e)}},120);
})();
</script>
