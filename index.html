<script id="sl87-support-recovery">
(function(){
  const R={target:null};
  window.SL87=R;

  const FE=window.friendlyError;
  window.friendlyError=function(e){
    const m=String(e?.message||e||'');
    if(/cannot_recover_self/i.test(m))return 'Ma t9derch tdir recovery l compte admin dyalk.';
    if(/cannot_recover_admin/i.test(m))return 'Compte admin ma kaytrecoverach mn had loutil.';
    if(/recovery_reason_required/i.test(m))return 'Kteb sabab wad7 dyal recovery.';
    if(/user_not_found/i.test(m))return 'Compte ma tl9ach.';
    if(/email_change_failed/i.test(m))return 'Ma t9drnach nbdlo l e-mail. Momkin deja mst3ml f compte akhor.';
    return FE?FE(e):m;
  };
  friendlyError=window.friendlyError;

  function sl87EnhanceUsers(){
    const panel=document.querySelector('[data-sl60-panel="users"]');
    const rows=panel?.querySelectorAll('tbody tr');
    const users=window.SL60?.adminUsers?.users||[];
    if(!panel||!rows?.length||!users.length)return;
    rows.forEach(function(tr,i){
      const u=users[i];
      if(!u||u.is_owner_admin||String(u.id)===String(state.user?.id)||tr.querySelector('.sl87RecoverBtn'))return;
      const actions=tr.querySelector('td:last-child .rowBtns')||tr.querySelector('td:last-child');
      if(!actions)return;
      const b=document.createElement('button');
      b.className='btn soft sl41-mini sl87RecoverBtn';
      b.type='button';
      b.textContent='🛟 Récupérer';
      b.onclick=function(){sl87OpenRecovery(u.id)};
      actions.appendChild(b);
    });
  }
  window.sl87EnhanceUsers=sl87EnhanceUsers;

  function histHtml(list){
    if(!Array.isArray(list)||!list.length)return '<div class="sub">Aucun historique.</div>';
    return '<div class="sl87RecoveryHistory">'+list.map(function(x){
      const before=x.old_email?esc(x.old_email):'—';
      const after=x.new_email?esc(x.new_email):'—';
      return '<div><b>'+before+' → '+after+'</b><br><span class="sub">'+formatDate(x.changed_at||x.created_at)+' • '+esc(x.source||x.reason||'')+'</span></div>';
    }).join('')+'</div>';
  }

  window.sl87OpenRecovery=async function(userId){
    document.querySelector('#sl87RecoveryModal')?.remove();
    try{
      const d=await api('/rest/v1/rpc/admin_validate_recovery_target',{method:'POST',auth:true,body:{p_user_id:userId}});
      R.target=d;
      document.body.insertAdjacentHTML('beforeend',
        '<div class="modal" id="sl87RecoveryModal"><div class="modalBox">'+
        '<div class="panelHead"><div><h2>🛟 Récupération de compte</h2><div class="sub">Outil support — compte perdu ou volé</div></div><button class="modalX" onclick="document.querySelector(\'#sl87RecoveryModal\').remove()">×</button></div>'+
        '<div class="sl87RecoveryWarn"><b>Important :</b> dir had recovery ghir ila t2kkedti mn howiyat sahib l compte. Had lprocess kay7yed ga3 sessions, kay7yed MFA, w y9der ybdel e-mail.</div>'+
        '<div class="sl87RecoverySummary">'+
          '<div><b>Vendeur</b>'+esc(d.full_name||'Utilisateur')+'</div>'+
          '<div><b>E-mail actuel</b>'+esc(d.email||'—')+'</div>'+
          '<div><b>Boutique</b>'+esc(d.shop_name||'Sans boutique')+'</div>'+
          '<div><b>Ville / WhatsApp</b>'+esc(d.shop_city||'—')+' • '+esc(d.shop_phone||'—')+'</div>'+
          '<div><b>Inscription</b>'+formatDate(d.created_at)+'</div>'+
          '<div><b>Dernière connexion</b>'+formatDate(d.last_sign_in_at)+'</div>'+
        '</div>'+
        '<details><summary><b>Historique des e-mails</b></summary>'+histHtml(d.email_history)+'</details>'+
        '<div class="field" style="margin-top:14px"><label>Nouvel e-mail sécurisé (optionnel)</label><input id="sl87NewEmail" type="email" placeholder="Laisser vide pour garder '+attr(d.email||'l e-mail actuel')+'"><small style="display:block;margin-top:6px;color:#718078">Ila l7rami bdel e-mail, dkhl hna e-mail jdida li support t2kked menha.</small></div>'+
        '<div class="field"><label>Raison / preuve vérifiée</label><textarea id="sl87Reason" rows="4" maxlength="1000" placeholder="Ex: client a confirmé ancien e-mail, nom boutique, téléphone et détails commande…"></textarea></div>'+
        '<div class="sl87Confirm"><label><input id="sl87IdentityOk" type="checkbox"> <span><b>Je confirme que j’ai vérifié l’identité du propriétaire.</b><br><small>Ma ndirch recovery ghir b talab bla vérification.</small></span></label></div>'+
        '<label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input id="sl87CloseShop" type="checkbox" checked> Fermer temporairement la boutique pendant la récupération</label>'+
        '<div class="field"><label>Confirmation</label><input id="sl87ConfirmWord" autocomplete="off" placeholder="Écrivez RECUPERER"></div>'+
        '<button id="sl87RecoverRun" class="btn primary full" onclick="sl87RunRecovery()">Sécuriser et récupérer le compte</button>'+
        (Array.isArray(d.recovery_history)&&d.recovery_history.length?'<details style="margin-top:16px"><summary><b>Historique support recovery</b></summary>'+histHtml(d.recovery_history)+'</details>':'')+
        '</div></div>'
      );
    }catch(e){toast(friendlyError(e))}
  };

  window.sl87RunRecovery=async function(){
    const d=R.target;if(!d)return;
    const newEmail=(document.querySelector('#sl87NewEmail')?.value||'').trim().toLowerCase();
    const reason=(document.querySelector('#sl87Reason')?.value||'').trim();
    const identityOk=!!document.querySelector('#sl87IdentityOk')?.checked;
    const closeShop=!!document.querySelector('#sl87CloseShop')?.checked;
    const word=(document.querySelector('#sl87ConfirmWord')?.value||'').trim().toUpperCase();

    if(!identityOk)return toast('Confirme d’abord que l’identité du propriétaire a été vérifiée.');
    if(reason.length<10)return toast('Kteb sabab / preuve b wa7d chwiya dyal tafasil.');
    if(word!=='RECUPERER')return toast('Kteb RECUPERER bach t2kked.');
    if(newEmail&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail))return toast('Nouvel e-mail invalide.');

    setBusy('#sl87RecoverRun',true,'Sécurisation…');
    try{
      const out=await api('/functions/v1/account-recovery',{
        method:'POST',auth:true,
        body:{user_id:d.id,new_email:newEmail,reason,close_shop:closeShop}
      });

      const msg=[
        'Compte sécurisé ✅',
        out.sessions_revoked?('Sessions fermées : '+Number(out.sessions_revoked)):'Sessions anciennes fermées.',
        out.mfa_cleared?('MFA supprimé : '+Number(out.mfa_cleared)):'MFA vérifié/nettoyé.',
        out.email_changed?('E-mail remplacé par : '+out.email):('E-mail conservé : '+out.email),
        out.recovery_email_sent?'Lien de récupération envoyé ✅':'⚠️ Lien e-mail non envoyé — réessayez plus tard.',
        out.shop_closed?'Boutique fermée temporairement.':'Boutique laissée ouverte.'
      ].join('\n');

      document.querySelector('#sl87RecoveryModal')?.remove();
      alert(msg);
      if(typeof sl60RenderAdmin==='function')await sl60RenderAdmin();
      setTimeout(function(){sl60AdminTab?.('users')},80);
    }catch(e){
      toast(friendlyError(e));
      setBusy('#sl87RecoverRun',false,'Sécuriser et récupérer le compte');
    }
  };

  const OLD_ADMIN=window.sl60RenderAdmin;
  if(OLD_ADMIN){
    window.sl60RenderAdmin=async function(){
      const r=await OLD_ADMIN();
      setTimeout(sl87EnhanceUsers,40);
      return r;
    };
    sl60RenderAdmin=window.sl60RenderAdmin;
  }
})();
</script>

<script id="sl88-admin-manager">
(function(){
  const A={owner:null};
  window.SL88=A;

  const FE=window.friendlyError;
  window.friendlyError=function(e){
    const m=String(e?.message||e||'');
    if(/owner_admin_required/i.test(m))return 'Ghir Admin principal li y9der y3ti ola y7yed صلاحية admin.';
    if(/cannot_revoke_owner/i.test(m))return 'Admin principal ma ymknch t7yed lih صلاحية admin.';if(/owner_account_protected/i.test(m))return 'Admin principal protégé : ma ymknch tblockih.';if(/owner_whitelist_protected/i.test(m))return 'Whitelist dyal Admin principal protégée : ma ymknch t7yedha.';
    return FE?FE(e):m;
  };
  friendlyError=window.friendlyError;

  window.sl88EnhanceUsers=async function(){
    const panel=document.querySelector('[data-sl60-panel="users"]');
    const rows=panel?.querySelectorAll('tbody tr');
    const users=window.SL60?.adminUsers?.users||[];
    if(!panel||!rows?.length||!users.length)return;

    if(A.owner===null){
      try{A.owner=await api('/rest/v1/rpc/is_platform_owner',{method:'POST',auth:true,body:{}})===true}
      catch{A.owner=false}
    }

    rows.forEach(function(tr,i){
      const u=users[i];
      if(!u)return;

      const first=tr.querySelector('td:first-child');
      if(first&&!first.querySelector('.sl88AdminBadge')&&u.is_admin){
        const badge=document.createElement('span');
        badge.className='sl88AdminBadge '+(u.is_owner_admin?'sl88OwnerBadge':'');
        badge.textContent=u.is_owner_admin?'👑 Admin principal':'🛡️ Admin';
        first.querySelector('b')?.appendChild(badge);
      }

      const actions=tr.querySelector('td:last-child .rowBtns')||tr.querySelector('td:last-child');
      if(!actions||actions.querySelector('.sl88AdminRoleBtn'))return;

      if(u.is_owner_admin){
        actions.querySelectorAll('button').forEach(function(btn){
          const oc=String(btn.getAttribute('onclick')||'');
          const tx=String(btn.textContent||'').trim();
          if(/sl60AdminSetUserBlock|sl87OpenRecovery/i.test(oc)||/^(Bloquer|Debloquer|Débloquer|Récupérer)$/i.test(tx)){
            btn.remove();
          }
        });
      }

      if(A.owner===true&&!u.is_owner_admin){
        const b=document.createElement('button');
        b.className='btn '+(u.is_admin?'soft':'primary')+' sl41-mini sl88AdminRoleBtn';
        b.type='button';
        b.textContent=u.is_admin?'Retirer admin':'Donner admin';
        b.onclick=function(){sl88SetAdmin(u.id,!!u.is_admin,u.email||u.full_name||'ce compte')};
        actions.appendChild(b);
      }
    });
  };

  window.sl88SetAdmin=async function(userId,isAdmin,label){
    const action=isAdmin?'retirer la permission ADMIN de':'donner la permission ADMIN à';
    if(!confirm('Confirmer : '+action+' '+label+' ?'))return;

    try{
      await api('/rest/v1/rpc/admin_set_platform_admin',{
        method:'POST',
        auth:true,
        body:{p_user_id:userId,p_enabled:!isAdmin}
      });
      toast(isAdmin?'Permission admin retirée.':'Permission admin accordée ✅');
      if(typeof sl60RenderAdmin==='function')await sl60RenderAdmin();
      setTimeout(function(){
        sl60AdminTab?.('users');
        sl88EnhanceUsers();
      },100);
    }catch(e){toast(friendlyError(e))}
  };

  const OLD_ADMIN=window.sl60RenderAdmin;
  if(OLD_ADMIN){
    window.sl60RenderAdmin=async function(){
      A.owner=null;
      const r=await OLD_ADMIN();
      setTimeout(sl88EnhanceUsers,80);
      return r;
    };
    sl60RenderAdmin=window.sl60RenderAdmin;
  }

  const OLD_ENH=window.sl87EnhanceUsers;
  if(OLD_ENH){
    window.sl87EnhanceUsers=function(){
      const r=OLD_ENH();
      Promise.resolve(r).then(function(){setTimeout(sl88EnhanceUsers,20)});
      return r;
    };
  }
})();
</script>

        :'<div class="sl89BanBox"><b>Ban définitif :</b><br>login kaytsed, sessions kaytseddo, boutique kattsed, w dak Gmail kayb9a m7jوز b had compte bach ma y9derch y3awd يسجل bih.</div>')+
      '<div class="field"><label>Raison</label><textarea id="sl89BanReason" rows="4" maxlength="1000" placeholder="'+(banned?'Ex: décision annulée après vérification…':'Ex: produit interdit, fraude, abus répété…')+'">'+esc(banned?'':(u.block_reason||''))+'</textarea></div>'+
      '<div class="field"><label>Confirmation</label><input id="sl89BanWord" autocomplete="off" placeholder="Écrivez '+(banned?'DEBANNIR':'BANNIR')+'"></div>'+
      '<button id="sl89BanRun" class="btn full '+(banned?'primary':'sl89DangerBtn')+'" onclick="sl89RunBan()">'+(banned?'Lever le ban définitif':'Bannir définitivement')+'</button>'+
      '</div></div>'
    );
  };

  window.sl89RunBan=async function(){
    const u=B.target;if(!u)return;
    const banned=!!u.permanent_ban;
    const reason=(document.querySelector('#sl89BanReason')?.value||'').trim();
    const word=(document.querySelector('#sl89BanWord')?.value||'').trim().toUpperCase();
    if(!banned&&reason.length<5)return toast('Kteb sabab dyal bannissement.');
    if(word!==(banned?'DEBANNIR':'BANNIR'))return toast('Kteb '+(banned?'DEBANNIR':'BANNIR')+' bach t2kked.');

    setBusy('#sl89BanRun',true,banned?'Déblocage…':'Bannissement…');
    try{
      await api('/rest/v1/rpc/admin_set_permanent_ban',{
        method:'POST',
        auth:true,
        body:{p_user_id:u.id,p_banned:!banned,p_reason:reason}
      });
      document.querySelector('#sl89BanModal')?.remove();
      toast(banned?'Ban définitif levé.':'Compte banni définitivement ✅');
      if(typeof sl60RenderAdmin==='function')await sl60RenderAdmin();
      setTimeout(function(){sl60AdminTab?.('users')},100);
    }catch(e){
      toast(friendlyError(e));
      setBusy('#sl89BanRun',false,banned?'Lever le ban définitif':'Bannir définitivement');
    }
  };

  window.sl89EnhanceUsers=async function(){
    const panel=document.querySelector('[data-sl60-panel="users"]');
    const rows=panel?.querySelectorAll('tbody tr');
    const users=window.SL60?.adminUsers?.users||[];
    if(!panel||!rows?.length||!users.length)return;

    if(B.owner===null){
      try{B.owner=await api('/rest/v1/rpc/is_platform_owner',{method:'POST',auth:true,body:{}})===true}
      catch{B.owner=false}
    }

    rows.forEach(function(tr,i){
      const u=users[i];if(!u)return;
      const first=tr.querySelector('td:first-child');
      if(u.permanent_ban&&first&&!first.querySelector('.sl89BanBadge')){
        const badge=document.createElement('span');
        badge.className='sl89BanBadge';
        badge.textContent='⛔ Banni définitif';
        first.querySelector('b')?.appendChild(badge);
      }

      const actions=tr.querySelector('td:last-child .rowBtns')||tr.querySelector('td:last-child');
      if(!actions)return;

      if(u.permanent_ban){
        actions.querySelectorAll('button').forEach(function(btn){
          const oc=String(btn.getAttribute('onclick')||'');
          const tx=String(btn.textContent||'').trim();
          if(/sl60AdminSetUserBlock|sl87OpenRecovery|sl88SetAdmin/i.test(oc)||/Bloquer|Debloquer|Débloquer|Récupérer|Donner admin|Retirer admin/i.test(tx)){
            btn.remove();
          }
        });
      }

      if(B.owner===true&&!u.is_owner_admin&&!actions.querySelector('.sl89PermBanBtn')){
        const b=document.createElement('button');
        b.type='button';
        b.className='btn sl41-mini sl89PermBanBtn '+(u.permanent_ban?'soft':'sl89DangerBtn');
        b.textContent=u.permanent_ban?'Lever ban définitif':'Bannir définitivement';
        b.onclick=function(){sl89OpenBan(u)};
        actions.appendChild(b);
      }
    });
  };

  const OLD_ADMIN=window.sl60RenderAdmin;
  if(OLD_ADMIN){
    window.sl60RenderAdmin=async function(){
      B.owner=null;
      const r=await OLD_ADMIN();
      setTimeout(sl89EnhanceUsers,120);
      return r;
    };
    sl60RenderAdmin=window.sl60RenderAdmin;
  }

  const OLD_88=window.sl88EnhanceUsers;
  if(OLD_88){
    window.sl88EnhanceUsers=async function(){
      const r=await OLD_88();
      await Promise.resolve(r);
      setTimeout(sl89EnhanceUsers,30);
      return r;
    };
  }
})();
</script>


<style id="sl91-blacklist-style">

.sl91BlackCard{border:1px solid #f0c2c2;background:#fffafa;border-radius:14px;padding:14px}
.sl91BlackHead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.sl91BlackMeta{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.sl91Pill{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#f1f4f2;border:1px solid #dfe6e2;font-size:10px;font-weight:800;color:#50605a}
.sl91Pill.danger{background:#fee2e2;border-color:#fecaca;color:#991b1b}
.sl91Reason{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #efdddd;line-height:1.45}
.sl91Actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sl91Evidence{display:grid;gap:9px;margin:12px 0}
.sl91EvidenceRow{padding:10px 11px;border:1px solid #e4e9e6;border-radius:10px;background:#fff}
.sl91EvidenceRow b{display:block;margin-bottom:3px}
.sl91Audit{display:grid;gap:8px;margin-top:10px}
.sl91Audit>div{padding:9px 10px;border:1px solid #e4e9e6;border-radius:10px;background:#f8faf9}
.sl91Empty{padding:26px;text-align:center;color:#718078}
@media(max-width:700px){.sl91BlackHead{flex-direction:column}}
</style>
<script id="sl91-blacklist">
(function(){
  const X={data:null,owner:null};
  window.SL91=X;

  function sl91ReportLabel(r){
    const p=r.product_name?(' • Produit: '+r.product_name):'';
    return (r.reason||'Signalement')+p;
  }

  window.sl91OpenDetails=function(userId){
    const item=(X.data?.items||[]).find(x=>String(x.user_id)===String(userId));
    if(!item)return;
    document.querySelector('#sl91DetailsModal')?.remove();

    const reports=Array.isArray(item.recent_reports)?item.recent_reports:[];
    const history=Array.isArray(item.history)?item.history:[];

    const reportHtml=reports.length?reports.map(function(r){
      return '<div class="sl91EvidenceRow">'+
        '<b>'+esc(sl91ReportLabel(r))+'</b>'+
        '<div class="sub">'+esc(r.status||'open')+' • '+formatDate(r.created_at)+'</div>'+
        (r.details?'<div style="margin-top:5px">'+esc(r.details)+'</div>':'')+
        (r.id?'<button class="btn soft sl41-mini" style="margin-top:8px" onclick="document.querySelector(\'#sl91DetailsModal\').remove();sl70OpenReport(\''+r.id+'\')">Ouvrir le signalement</button>':'')+
      '</div>';
    }).join(''):'<div class="sl91Empty">Aucun signalement lié à cette boutique.</div>';

    const historyHtml=history.length?history.map(function(h){
      return '<div><b>'+(h.action==='ban'?'⛔ Ban définitif':'✅ Ban levé')+'</b><div>'+esc(h.reason||'Sans raison')+'</div><div class="sub">'+formatDate(h.created_at)+' • '+esc(h.actor||'Administration')+'</div></div>';
    }).join(''):'<div class="sl91Empty">Aucun historique.</div>';

    document.body.insertAdjacentHTML('beforeend',
      '<div class="modal" id="sl91DetailsModal"><div class="modalBox">'+
      '<div class="panelHead"><div><h2>Dossier Blacklist</h2><div class="sub">'+esc(item.full_name||'Utilisateur')+' • '+esc(item.email||'')+'</div></div><button class="modalX" onclick="document.querySelector(\'#sl91DetailsModal\').remove()">×</button></div>'+
      '<div class="sl91Reason"><b>Raison du ban :</b><br>'+esc(item.reason||'Non précisée')+'</div>'+
      '<h3 style="margin-top:18px">Signalements / preuves</h3><div class="sl91Evidence">'+reportHtml+'</div>'+
      '<h3 style="margin-top:18px">Historique ban</h3><div class="sl91Audit">'+historyHtml+'</div>'+
      '</div></div>'
    );
  };

  window.sl91Unban=async function(userId,label){
    if(X.owner!==true)return toast('Ghir Admin principal li y9der y7yed ban définitif.');
    const word=prompt('Bach t7yed lban définitif mn '+label+', kteb DEBANNIR :','');
    if(String(word||'').trim().toUpperCase()!=='DEBANNIR')return;
    const reason=prompt('Note optionnelle :','Décision annulée par Admin principal')||'';
    try{
      await api('/rest/v1/rpc/admin_set_permanent_ban',{
        method:'POST',auth:true,
        body:{p_user_id:userId,p_banned:false,p_reason:reason}
      });
      toast('Ban définitif levé.');
      await sl60RenderAdmin();
      setTimeout(function(){sl60AdminTab('blacklist')},120);
    }catch(e){toast(friendlyError(e))}
  };

  window.sl91LoadBlacklist=async function(){
    const tabs=document.querySelector('.sl60AdminTabs');
    if(!tabs)return;
    try{
      const results=await Promise.all([
        api('/rest/v1/rpc/get_admin_blacklist_dashboard',{method:'POST',auth:true,body:{}}),
        api('/rest/v1/rpc/is_platform_owner',{method:'POST',auth:true,body:{}})
      ]);
      X.data=results[0]||{count:0,items:[]};
      X.owner=results[1]===true;

      let btn=tabs.querySelector('[data-tab="blacklist"]');
      if(!btn){
        btn=document.createElement('button');
        btn.className='btn soft';
        btn.dataset.tab='blacklist';
        btn.onclick=function(){sl60AdminTab('blacklist')};
        tabs.appendChild(btn);
      }
      btn.textContent='Blacklist'+(Number(X.data.count||0)?' ('+Number(X.data.count||0)+')':'');

      document.querySelector('[data-sl60-panel="blacklist"]')?.remove();
      const panel=document.createElement('div');
      panel.className='panel';
      panel.dataset.sl60Panel='blacklist';
      panel.style.display='none';

      const items=Array.isArray(X.data.items)?X.data.items:[];
      if(!items.length){
        panel.innerHTML='<div class="sl91Empty"><b>Blacklist vide</b><br>Aucun compte banni définitivement.</div>';
      }else{
        panel.innerHTML='<div class="panelHead"><div><h3>Blacklist</h3><div class="sub">Comptes bannis définitivement. Les signalements ne déclenchent jamais un ban automatique.</div></div></div>'+
          '<div class="sl91BlacklistGrid">'+items.map(function(x){
            const unban=X.owner===true?'<button class="btn soft" onclick="sl91Unban(\''+x.user_id+'\',\''+attr(x.full_name||x.email||'ce compte')+'\')">Lever le ban</button>':'';
            return '<div class="sl91BlackCard">'+
              '<div class="sl91BlackHead"><div><b style="font-size:16px">'+esc(x.full_name||'Utilisateur')+'</b><br><span class="sub">'+esc(x.email||'')+'</span>'+
              '<div class="sl91BlackMeta"><span class="sl91Pill danger">⛔ Blacklist</span><span class="sl91Pill">'+esc(x.shop_name||'Sans boutique')+'</span><span class="sl91Pill">'+formatDate(x.banned_at)+'</span></div></div>'+
              '<div class="sl91BlackMeta"><span class="sl91Pill">'+Number(x.reports_count||0)+' signalement(s)</span><span class="sl91Pill">'+Number(x.product_reports_count||0)+' produit(s) signalé(s)</span><span class="sl91Pill">'+Number(x.open_reports_count||0)+' ouvert(s)</span></div></div>'+
              '<div class="sl91Reason"><b>Raison :</b> '+esc(x.reason||'Non précisée')+'</div>'+
              '<div class="sl91Actions"><button class="btn soft" onclick="sl91OpenDetails(\''+x.user_id+'\')">Voir dossier / preuves</button>'+unban+'</div>'+
            '</div>';
          }).join('')+'</div>';
      }
      tabs.parentElement.appendChild(panel);
    }catch(e){
      console.warn('Blacklist:',e);
    }
  };

  const OLD_ADMIN=window.sl60RenderAdmin;
  if(OLD_ADMIN){
    window.sl60RenderAdmin=async function(){
      const r=await OLD_ADMIN();
      await Promise.resolve(r);
      setTimeout(sl91LoadBlacklist,80);
      return r;
    };
    sl60RenderAdmin=window.sl60RenderAdmin;
  }
})();
</script>
