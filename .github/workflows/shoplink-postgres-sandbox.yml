name: ShopLink PostgreSQL Sandbox

on:
  push:
    branches:
      - fix/shoplink-security-otp-20261025
    paths:
      - 'index.html'
      - 'tests/**'
      - 'supabase/changes/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'ops/**'
      - 'payments/**'
      - '.github/workflows/shoplink-postgres-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ephemeral-postgres:
    name: Compile SQL and test retries (no Supabase access)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shoplink_sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: shoplink_sandbox
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
      - name: Simulated frontend recovery tests
        run: node tests/checkout-recovery.test.cjs
      - name: Payment idempotency sandbox (no real charges)
        run: node tests/payment-gateway-contract-sandbox.test.cjs
      - name: Validate backup helper without a database connection
        shell: pwsh
        run: ./tests/backup-helper.test.ps1
      - name: Install Deno for prepared Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Check prepared Edge Functions
        run: |
          deno check supabase/functions/contact-unlock/index.ts supabase/functions/contact-payment-webhook/index.ts
          deno test --allow-env=CONTACT_PAYMENT_ALLOWED_ORIGIN tests/payment-edge.test.ts
      - name: Ensure PostgreSQL client exists
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Compile migration and exercise real PostgreSQL concurrency
        run: bash tests/postgres-sandbox.test.sh
